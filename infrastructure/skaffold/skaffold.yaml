apiVersion: skaffold/v4beta3
kind: Config

requires:
  - path: port-forwards.yaml

manifests:
  kustomize:
    paths:
      - infrastructure/kubernetes/overlays/development

deploy:
  statusCheck: true
  statusCheckDeadlineSeconds: 3600
  kubectl:
    hooks:
      before:
        - host:
            command:
              - "powershell"
              - "-NoProfile"
              - "-Command"
              - "kubectl delete validatingwebhookconfigurations ingress-nginx-admission --ignore-not-found=true"

      after:
        - host:
            command:
              - "powershell"
              - "-NoProfile"
              - "-Command"
              - "Start-Process stripe -ArgumentList 'listen --forward-to localhost:4012/webhook/payment' -WindowStyle Minimized"
        - host:
            command:
              - "powershell"
              - "-NoProfile"
              - "-Command"
              - "Start-Process minikube -ArgumentList 'tunnel' -WindowStyle Minimized"

build:
  local:
    push: false
    useBuildkit: true
    concurrency: 1

  artifacts:

    - image: delivery/notification
      context: .
      docker:
        dockerfile: services/notification-service/Dockerfile
      sync:
        manual:
          - src: "services/notification-service/src/**/*.ts"
            dest: /usr/src/app/services/notification-service/src
          - src: "protos/**/*.proto"
            dest: /usr/src/app/protos

    - image: delivery/realtime
      context: .
      docker:
        dockerfile: services/realtime-service/Dockerfile
      sync:
        manual:
          - src: "services/realtime-service/src/**/*.ts"
            dest: /usr/src/app/services/realtime-service/src
          - src: "protos/**/*.proto"
            dest: /usr/src/app/protos

    - image: delivery/media
      context: .
      docker:
        dockerfile: services/media-service/Dockerfile

    - image: delivery/search
      context: .
      docker:
        dockerfile: services/search-service/Dockerfile

    - image: delivery/payment
      context: .
      docker:
        dockerfile: services/payment-service/Dockerfile

    - image: delivery/user
      context: .
      docker:
        dockerfile: services/user-service/Dockerfile
      sync:
        manual:
          - src: 'services/user-service/src/**/*.ts'
            dest: /usr/src/app/services/user-service/src
          - src: "protos/**/*.proto"
            dest: /usr/src/app/protos

    - image: delivery/delivery
      context: .
      docker:
        dockerfile: services/delivery-service/Dockerfile
      sync:
        manual:
          - src: 'services/delivery-service/src/**/*.ts'
            dest: /usr/src/app/services/delivery-service/src
          - src: "protos/**/*.proto"
            dest: /usr/src/app/protos

    - image: delivery/driver
      context: .
      docker:
        dockerfile: services/driver-service/Dockerfile

    - image: delivery/analytics
      context: .
      docker:
        dockerfile: services/analytics-service/Dockerfile

    - image: delivery/api-gateway
      context: .
      docker:
        dockerfile: services/api-gateway/Dockerfile
      sync:
        manual:
          - src: "services/api-gateway/src/**/*.ts"
            dest: /usr/src/app/services/api-gateway/src
          - src: "protos/**/*.proto"
            dest: /usr/src/app/protos

    - image: delivery/alertmanager-discord
      context: infrastructure/observability/discord-relay
      docker:
        dockerfile: Dockerfile

profiles:
  - name: test
    manifests:
      kustomize:
        paths:
          - infrastructure/kubernetes/overlays/test
  - name: production
    manifests:
      kustomize:
        paths:
          - infrastructure/kubernetes/overlays/production