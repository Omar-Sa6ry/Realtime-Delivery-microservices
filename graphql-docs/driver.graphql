  ) {
    success
    statusCode
    message
    timeStamp
    data {
      id
      delivery {
        id
      }
      driver {
        id
      }
      status
      rejectedAt
      updatedAt
    }
  }
}

# Register Driver (Admin / onboarding) - WRAPPED response
mutation RegisterDriver {
  registerDriver(input: {
    userId: "user-789"
    vehicleType: CAR
    plateNumber: "ABC-123"
    capacityKg: 50
    capabilities: ["STANDARD"]
    serviceArea: "Cairo"
  }) {
    success
    statusCode
    message
    timeStamp
    data {
      id
      user {
        id
      }
      status
      vehicleType
      plateNumber
      capacityKg
      capabilities
      serviceArea
      createdAt
    }
  }
}

