# Check if user service is reachable (Public)
query {
  pingForUser {
    statusCode
    message
    success
    data
  }
}

# Get the profile of the currently logged-in user (User / Driver / Admin)
query {
  myProfile {
    statusCode
    message
    success
    data {
      id
      firstName
      lastName
      email
      isActive
      imageUrl
      addresses {
        title
        street
        city
        state
        postalCode
        latitude
        longitude
        isDefault
        createdAt
      }
      role
      phoneNumber
      createdAt
    }
  }
}

# Get a specific user by their ID (Admin)
query {
  user(id: "367980963323449344") {
    statusCode
    message
    success
    data {
      id
      firstName
      lastName
      email
      isActive
      imageUrl
      addresses {
        title
        street
        city
        state
        postalCode
        latitude
        longitude
        isDefault
        createdAt
      }
      role
      phoneNumber
      createdAt
    }
  }
}

# Update the profile of the currently logged-in user (User / Driver / Admin)
mutation {
  updateProfile(input: { firstName: "Ahmed", lastName: "Sabry" }) {
    statusCode
    message
    success
    data {
      id
      firstName
      lastName
      email
      isActive
      imageUrl
      addresses {
        title
        street
        city
        state
        postalCode
        latitude
        longitude
        isDefault
        createdAt
      }
      role
      phoneNumber
      createdAt
    }
  }
}

# Promote a user to Admin (Admin)
mutation {
  promoteUserToAdmin(id: "367981481311604736") {
    statusCode
    message
    success
    data
  }
}

# Toggle user active status (Admin)
mutation {
  toggleUserActive(id: "367981824183373824", isActive: false) {
    statusCode
    message
    success
  }
}

# Delete a user (Admin)
mutation {
  deleteUser(id: "367981824183373824") {
    statusCode
    message
    success
  }
}

# Add a new address to user profile
mutation {
  addAddress(
    input: {
      title: "Home"
      street: "El-Galaa Street"
      city: "Cairo"
      state: "Cairo Governorate"
      postalCode: "11511"
      isDefault: true
    }
  ) {
    statusCode
    message
    success
    data {
      id
      title
      street
      city
      state
      postalCode
      latitude
      longitude
      isDefault
      createdAt
    }
  }
}

# Delete an address from user profile
mutation {
  deleteAddress(addressId: "367982146935066624") {
    statusCode
    message
    success
  }
}

# Set an address as default
mutation {
  setDefaultAddress(addressId: "367982285561008128") {
    statusCode
    message
    success
  }
}

# Retrieve currently logged-in user's addresses
query {
  myAddresses {
    statusCode
    message
    success
    data {
      id
      title
      street
      city
      state
      postalCode
      latitude
      longitude
      isDefault
      createdAt
    }
  }
}
