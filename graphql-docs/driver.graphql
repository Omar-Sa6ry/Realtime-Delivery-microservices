# Get Dispatch Attempts for a Delivery - WRAPPED response
query GetDispatchAttempts($deliveryId: ID!) {
  dispatchAttempts(deliveryId: $deliveryId) {
    success
    statusCode
    message
    timeStamp
    data {
      paginationInfo {
        totalItems
        currentPage
        nextPage
      }
      items {
        id
        isActive
        delivery {
          id
        }
        driver {
          id
        }
        distanceMeters
        attemptNumber
        result
        reason
        createdAt
      }
    }
  }
}
