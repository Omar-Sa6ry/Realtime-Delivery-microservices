# ─── REVIEWS & RATINGS ─────────────────────────────────────

# Rate a Driver - WRAPPED response
mutation RateDriver {
  rateDriver(input: {
    driverId: "driver-123"
    deliveryId: "delivery-456"
    rating: 4.5
    comment: "Excellent service!"
  }) {
    success
    statusCode
    message
    timeStamp
    data {
      id
      driverId
      userId
      deliveryId
      rating
      comment
      createdAt
    }
  }
}

# Get Driver Reviews (Admin) - WRAPPED response
query GetDriverReviews {
  driverReviews(driverId: "driver-123", page: 1, limit: 10) {
    success
    statusCode
    message
    timeStamp
    data {
      paginationInfo {
        totalItems
        currentPage
        nextPage
      }
      items {
        id
        userId
        deliveryId
        rating
        comment
        createdAt
      }
      averageRating
      totalReviews
    }
  }
}