# ─── QUERIES ───────────────────────────────────────────────

# Get a specific media file by ID (Single Item Envelope)
query GetMedia {
  media(mediaId: "media-001") {
    success
    statusCode
    message
    timeStamp
    data {
      mediaId
      ownerId
      fileName
      contentType
      mediaType
      size
      status
      objectKey
      createdAt
      updatedAt
      versions {
        versionType
        objectKey
        contentType
        size
        width
        height
        durationMs
      }
    }
  }
}

# Get paginated list of media files (Paginated Collection Envelope)
query ListMedia {
  listMedia(ownerId: "user-001", limit: 10, cursor: "") {
    success
    statusCode
    message
    timeStamp
    data {
      paginationInfo {
        totalItems
        currentPage
        nextPage
      }
      items {
        mediaId
        ownerId
        fileName
        contentType
        mediaType
        size
        status
        createdAt
      }
    }
  }
}

# Get upload status (Single Item Envelope)
query GetUploadStatus {
  uploadStatus(uploadId: "upload-001") {
    success
    statusCode
    message
    timeStamp
    data {
      uploadId
      status
      totalParts
      completedParts
      missingParts
      expiresAt
    }
  }
}

# Get presigned download URL (Single Item Envelope)
query GetDownloadUrl {
  downloadUrl(mediaId: "media-001", versionType: "original", expirySeconds: 3600) {
    success
    statusCode
    message
    timeStamp
    data {
      url
      expiresAt
      contentType
    }
  }
}

# Get user quota (Single Item Envelope)
query GetQuota {
  quota {
    success
    statusCode
    message
    timeStamp
    data {
      usedBytes
      quotaBytes
      remainingBytes
      activeUploads
      maxConcurrentUploads
    }
  }
}

# Get DLQ topics
query GetDLQTopics {
  dlqTopics
}

# Get DLQ statistics (Collection Envelope)
query GetDLQStats {
  dlqStats(topics: ["media-events-dlq"]) {
    success
    statusCode
    message
    timeStamp
    data {
      topic
      messageCount
    }
  }
}

# ─── MUTATIONS ──────────────────────────────────────────────

# Create upload session (Single Item Envelope)
mutation CreateUploadSession {
  createUploadSession(
    input: {
      fileName: "sample.mp4"
      contentType: "video/mp4"
      size: 104857600
      checksum: "sha256-xyz"
      deliveryId: "delivery-123"
      idempotencyKey: "upload-key-123"
    }
  ) {
    success
    statusCode
    message
    timeStamp
    data {
      mediaId
      uploadId
      s3UploadId
      presignedParts {
        partNumber
        presignedUrl
      }
      partSize
      totalParts
      expiresAt
    }
  }
}

# Complete upload session (Single Item Envelope)
mutation CompleteUpload {
  completeUpload(
    input: {
      uploadId: "upload-001"
      parts: [
        { partNumber: 1, eTag: "etag-001" }
      ]
      idempotencyKey: "complete-key-123"
    }
  ) {
    success
    statusCode
    message
    timeStamp
    data {
      mediaId
      status
    }
  }
}

# Abort upload session (Base Response Envelope)
mutation AbortUpload {
  abortUpload(uploadId: "upload-001") {
    success
    statusCode
    message
    timeStamp
    data
  }
}

# Delete media file (Base Response Envelope)
mutation DeleteMedia {
  deleteMedia(mediaId: "media-001", idempotencyKey: "del-001") {
    success
    statusCode
    message
    timeStamp
    data
  }
}

# Replay DLQ messages (Single Item Envelope)
mutation ReplayDLQ {
  dlqReplay(topic: "media-events-dlq", maxMessages: 50) {
    success
    statusCode
    message
    timeStamp
    data {
      success
      replayedCount
      errors
    }
  }
}

# Renew presigned upload URLs (Single Item Envelope)
mutation RenewPresigned {
  renewPresigned(input: { uploadId: "upload-001", expirySeconds: 3600 }) {
    success
    statusCode
    message
    timeStamp
    data {
      uploadId
      s3UploadId
      presignedParts {
        partNumber
        presignedUrl
      }
      partSize
      totalParts
      expiresAt
    }
  }
}