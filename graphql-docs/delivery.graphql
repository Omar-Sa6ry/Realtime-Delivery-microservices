# Get Delivery Service Health & Info
query GetDeliveryServiceInfo {
  deliveryServiceInfo {
    success
    statusCode
    message
    timeStamp
    data {
      name
      version
      status
    }
  }
}

# Create a New Delivery (with Pickup, Dropoff & Idempotency Key)
mutation CreateDelivery {
  createDelivery(
    input: {
      amount: "25.50"
      currency: "USD"
      # customerId:"354267546792235009"
      pickupAddress: {
        line1: "1 Main Street"
        line2: "Floor 3, Apt 12"
        city: "Cairo"
        state: "Cairo"
        postalCode: "11511"
        countryCode: "EG"
        latitude: 30.0444
        longitude: 31.2357
      }
      dropoffAddress: {
        line1: "2 Nile Corniche"
        line2: "Tower A"
        city: "Giza"
        state: "Giza"
        postalCode: "12511"
        countryCode: "EG"
        latitude: 30.0131
        longitude: 31.2089
      }
      idempotencyKey: "decreate-123456789c0123e45r67c8"
    }
  ) {
    success
    statusCode
    message
    timeStamp
    data {
      id
      driver {
        email
      }
      customer {
        email
        firstName
        role
      }
      status
      paymentStatus
      amount
      currency
      pickupAddress {
        line1
        city
        countryCode
        line2
        state
        postalCode
        latitude
        longitude
      }
      dropoffAddress {
        line1
        city
        countryCode
      }
      createdAt
      updatedAt
    }
  }
}

# Get Allowed Next State Transitions for a Delivery
query GetDeliveryNextStatuses {
  deliveryNextStatuses(id: "354303639159836672") {
    success
    statusCode
    message
    timeStamp
    data {
      statuses
    }
  }
}

# Transition Delivery Status (State Machine Progression)
# Possible statuses: DRIVER_ASSIGNED, DRIVER_ACCEPTED, PICKED_UP, IN_TRANSIT, COMPLETED, CANCELLED
mutation TransitionDelivery {
  transitionDelivery(
    input: {
      deliveryId: "354303639159836672"
      status: DRIVER_ACCEPTED
      note: "Driver assigned to pickup package"
    }
  ) {
    success
    statusCode
    message
    timeStamp
    data {
      id
      driver {
        email
      }
      customer {
        email
        firstName
        role
      }
      status
      paymentStatus
      pickedUpAt
      completedAt
      cancelledAt
      currency
      amount
      statusHistory {
        status
        changedBy
        note
        createdAt
      }
      pickupAddress {
        line1
        city
        countryCode
        line2
        state
        postalCode
        latitude
        longitude
      }
      dropoffAddress {
        line1
        city
        countryCode
      }
      updatedAt
    }
  }
}

#Cancel a Delivery
mutation CancelDelivery {
  cancelDelivery(
    deliveryId: "354301801656225792"
    reason: "Customer requested cancellation before pickup"
  ) {
    success
    statusCode
    message
    timeStamp
    data {
      id
      status
      cancelledAt
      updatedAt
    }
  }
}

# Get My Deliveries (Paginated for Authenticated Customer)
query GetMyDeliveries {
  myDeliveries(page: 1, pageSize: 20) {
    success
    statusCode
    message
    timeStamp
    data {
      paginationInfo {
        totalItems
        currentPage
        nextPage
      }
      items {
        id
        driver {
          email
        }
        customer {
          email
          firstName
          role
        }
        status
        paymentStatus
        amount
        currency
        pickupAddress {
          line1
          city
          countryCode
          line2
          state
          postalCode
          latitude
          longitude
        }
        dropoffAddress {
          line1
          city
          countryCode
        }
        createdAt
        updatedAt
      }
    }
  }
}

