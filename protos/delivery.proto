syntax = "proto3";
package delivery;

option go_package = "github.com/Omar-Sa6ry/Realtime-Delivery-microservices/services/driver-service/internal/adapters/grpc/proto";

service DeliveryService {
  rpc IsParticipant (ParticipantRequest) returns (ParticipantResponse);
  rpc GetDelivery (GetDeliveryRequest) returns (GetDeliveryResponse);
  rpc RefundPayment (RefundPaymentRequest) returns (RefundPaymentResponse);
  rpc GetOpenDeliveries (GetOpenDeliveriesRequest) returns (GetOpenDeliveriesResponse);
}

message ParticipantRequest { 
  string userId = 1; 
  string deliveryId = 2; 
}

message ParticipantResponse { 
  bool isParticipant = 1; 
}

message GetDeliveryRequest { 
  string deliveryId = 1; 
}

message GetDeliveryResponse { 
  bool found = 1; 
  string deliveryId = 2; 
  string customerId = 3; 
  string driverId = 4; 
  string status = 5; 
  double amount = 6; 
  string currency = 7; 
}

message RefundPaymentRequest { 
  string deliveryId = 1; 
  string reason = 2; 
}

message RefundPaymentResponse { 
  bool accepted = 1; 
  string deliveryId = 2; 
  string refundId = 3; 
}

message GetOpenDeliveriesRequest {
  int32 page = 1;
  int32 limit = 2;
}

message OpenDeliverySummary {
  string id = 1;
  string customer_id = 2;
  string status = 3;
  string pickup_city = 4;
  string pickup_country = 5;
  string dropoff_city = 6;
  string dropoff_country = 7;
  string amount = 8;
  string currency = 9;
  string created_at = 10;
}

message GetOpenDeliveriesResponse {
  repeated OpenDeliverySummary items = 1;
  int32 total_items = 2;
}

