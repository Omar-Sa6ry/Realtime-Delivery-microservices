apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis-srv 6379; do echo "Waiting for redis..."; sleep 3; done; echo "redis TCP ready"']
      containers:
        - name: api-gateway
          image: delivery/api-gateway
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          startupProbe:
            httpGet:
              path: /health
              port: 4000
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          env:
            - name: PORT_GATEWAY
              value: "4000"
            - name: NODE_ENV
              value: "development"
            - name: REDIS_HOST
              value: "redis-srv"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_DB
              value: "0"
            - name: RATE_LIMIT_LIMIT
              value: "100"
            - name: RATE_LIMIT_WINDOW_MS
              value: "60000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-srv
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      protocol: TCP
      port: 4000
      targetPort: 4000
