query {
  autocomplete(
    input: {
      prefix: "high"
      index: "media"
      # index: "users"
      limit: 5
    }
  ) {
    data {
      suggestions
    }
  }
}

# Search users (Admin only; requires Bearer token with VIEW_USER permission)
query {
  searchUsers(
    input: {
      query: "omarrrr"
      role:"user"
      isActive:true
      pagination: { limit: 4 }
    }
  ) {
    items {
      id
      first_name
      last_name
      email
      role
      is_active
      created_at
    }
    pageInfo {
      hasNextPage
      cursor
      total
    }
  }
}


# Search Media (Admin only; requires Bearer token with VIEW_USER permission)
query {
  searchMedia(
    input: {
      query: "High"
      pagination: { limit: 10 }
    }
  ) {
    items {
      media_id
      file_name
      mime_type
      owner_id
      size
      status
      created_at
    }
    pageInfo {
      hasNextPage
      cursor
      total
    }
  }
}


# Search deliveries (search-service)
# Supports full-text query, status filter, city, driverId, customerId, fromDate, toDate, geo bounding, and pagination
query {
  searchDeliveries(
    input: {
      query: "Cairo"
      status: "CREATED"
      pagination: { limit: 10 }
    }
  ) {
    items {
      delivery_id
      customer_id
      driver_id
      status
      pickup {
        city
        country
        location {
          lat
          lon
        }
      }
      dropoff {
        city
        country
        location {
          lat
          lon
        }
      }
      created_at
      updated_at
      source_version
    }
    pageInfo {
      hasNextPage
      cursor
      total
    }
  }
}

# Search drivers (search-service)
query {
  searchDrivers(
    input: {
      query: "Ahmed"
      pagination: { limit: 10 }
    }
  ) {
    items {
      driver_id
      name
      status
      vehicle_type
      rating
      location {
        lat
        lon
      }
      updated_at
      source_version
    }
    pageInfo {
      hasNextPage
      cursor
      total
    }
  }
}

