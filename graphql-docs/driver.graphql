# ─── MUTATIONS ──────────────────────────────────────────────

# Go Online - WRAPPED response
mutation GoOnline {
  goOnline(idempotencyKey: "go-online-driver-123-1234567890") {
    success
    statusCode
    message
    timeStamp
    data {
      id
      status
      updatedAt
    }
  }
}

# Go Offline - WRAPPED response
mutation GoOffline {
  goOffline(idempotencyKey: "go-offline-driver-123-1234567890") {
    success
    statusCode
    message
    timeStamp
    data {
      id
      status
      updatedAt
    }
  }
}

# Accept Assignment - WRAPPED response
mutation AcceptAssignment {
  acceptAssignment(
    assignmentId: "assignment-123"
    idempotencyKey: "accept-assignment-123-driver-456"
  ) {
    success
    statusCode
    message
    timeStamp
    data {
      id
      delivery {
        id
      }
      driver {
        id
      }
      status
      acceptedAt
      updatedAt
    }
  }
}

# Reject Assignment - WRAPPED response
mutation RejectAssignment {
