# Get Payment Service Info (Public)
query GetPaymentServiceInfo {
  paymentServiceInfo {
    success
    statusCode
    message
    timeStamp
    data {
      name
      version
      status
    }
  }
}

# List Payments - Paginated with paginationInfo (Admin)
query GetPaymentsList {
  payments(page: 1, limit: 10) {
    success
    statusCode
    message
    timeStamp
    data {
      paginationInfo {
        totalItems
        currentPage
        nextPage
      }
      items {
        id
        deliveryId
        delivery {
          id
        }
        userId
        user {
          id
        }
        amountMinor
        currency
        status
        provider
        correlationId
        causationId
        createdAt
        updatedAt
        authorizedAt
        capturedAt
      }
    }
  }
}

# Get Payment by ID with federated User & Delivery stubs (User / Driver / Admin)
query GetPaymentById {
  payment(id: "63359164469") {
    success
    statusCode
    message
    timeStamp
    data {
      id
      deliveryId
      delivery {
        id
      }
      userId
      user {
        id
      }
      amountMinor
      currency
      status
      provider
      correlationId
      causationId
      createdAt
      updatedAt
      authorizedAt
      capturedAt
    }
  }
}
