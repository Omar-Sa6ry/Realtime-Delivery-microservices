# Get Dispatch Attempts for a Delivery (Admin)
query GetDispatchAttempts($deliveryId: ID!) {
  dispatchAttempts(deliveryId: $deliveryId) {
    success
    statusCode
    message
    timeStamp
    data {
      paginationInfo {
        totalItems
        currentPage
        nextPage
      }
      items {
        id
        isActive
        delivery {
          id
        }
        driver {
          id
        }
        distanceMeters
        attemptNumber
        result
        reason
        createdAt
      }
    }
  }
}
{
  "deliveryId": "356558490791055360"
}

