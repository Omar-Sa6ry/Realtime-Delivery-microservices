# ==============================================================================
# REALTIME WEBSOCKETS TESTING GUIDE (POSTMAN & CLIENT APPS)
# ==============================================================================
#
# SECURITY & AUTHORIZATION RULES (RBAC + ABAC Architecture):
# ------------------------------------------------------------------------------
# 1. Zero-Trust Handshake:
#    - All WebSocket connections MUST provide a valid JWT token (via query `?token=...` or `Authorization: Bearer ...`).
# 2. Strict Delivery Subscription Access Control:
#    - Only ADMIN or the OWNER OF THE DELIVERY (Customer `customerId`) or the ASSIGNED DRIVER (`driverId`) can subscribe.
#    - Anyone else attempting to subscribe to a delivery receives:
#      { "type": "ERROR", "code": "FORBIDDEN", "message": "You are not authorized to access this delivery" }
# 3. Location Update Security:
#    - Only the ASSIGNED DRIVER of the specific delivery can send LOCATION_UPDATE.
#    - The location is validated, cached in Redis, and broadcasted via NATS fan-out ONLY to authorized subscribers of that delivery (Admin & Delivery Owner).
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# 1. CONNECTION & AUTHENTICATION (Handshake)
# ------------------------------------------------------------------------------
# In Postman WebSocket Request:
# 
# Option A (Recommended - via Query Parameter):
# Enter this URL in Postman (replace YOUR_JWT_ACCESS_TOKEN with your login token):
# ws://localhost:4000/ws?token=YOUR_JWT_ACCESS_TOKEN_HERE
#
# Option B (via Request Headers):
# URL: ws://localhost:4000/ws
# In the "Headers" tab in Postman, add:
# Key: Authorization
# Value: Bearer YOUR_JWT_ACCESS_TOKEN_HERE
#
# Click "Connect". 
# Upon success, the server will respond immediately with:
# {
#   "type": "CONNECTED",
#   "timestamp": "2026-09-03T...",
#   "data": { "socketId": "...", "nodeId": "..." }
# }

# ------------------------------------------------------------------------------
# 2. PING / HEARTBEAT
# ------------------------------------------------------------------------------
# Send this in the "Message" tab:
# {
#   "type": "PING"
# }

# ------------------------------------------------------------------------------
# 3. SUBSCRIBE TO DELIVERY UPDATES
# ------------------------------------------------------------------------------
# Security Policy:
# - Allowed Roles: ADMIN, or CUSTOMER (Delivery Owner), or ASSIGNED DRIVER.
# - Any other user will be rejected with FORBIDDEN (403).
#
# Send this message to subscribe to real-time events for a specific delivery:
# {
#   "type": "SUBSCRIBE_DELIVERY",
#   "data": {
#     "deliveryId": "YOUR_DELIVERY_ID_HERE"
#   }
# }
#
# Response on success:
# {
#   "type": "SUBSCRIBED",
#   "data": { "deliveryId": "YOUR_DELIVERY_ID_HERE" }
# }

# ------------------------------------------------------------------------------
# 4. UNSUBSCRIBE FROM DELIVERY UPDATES
# ------------------------------------------------------------------------------
# {
#   "type": "UNSUBSCRIBE_DELIVERY",
#   "data": {
#     "deliveryId": "YOUR_DELIVERY_ID_HERE"
#   }
# }
#
# Response on success:
# {
#   "type": "UNSUBSCRIBED",
#   "data": { "deliveryId": "YOUR_DELIVERY_ID_HERE" }
# }

# ------------------------------------------------------------------------------
# 5. DRIVER LOCATION UPDATE (Active Delivery Tracking)
# ------------------------------------------------------------------------------
# Security Policy:
# - Sender MUST be role DRIVER and MUST be assigned to this specific deliveryId.
# - Only ADMIN and the Delivery Owner (Customer) who subscribed to this delivery will receive the updates.
#
# {
#   "type": "LOCATION_UPDATE",
#   "data": {
#     "deliveryId": "YOUR_DELIVERY_ID_HERE",
#     "latitude": 30.0444,
#     "longitude": 31.2357,
#     "heading": 90.0,
#     "speed": 35.5
#   }
# }

# ------------------------------------------------------------------------------
# 6. ASSIGNMENT COMMANDS (Driver Only)
# ------------------------------------------------------------------------------
# Accept Assignment:
# {
#   "type": "ACCEPT_ASSIGNMENT",
#   "data": {
#     "deliveryId": "YOUR_DELIVERY_ID_HERE"
#   }
# }
#
# Reject Assignment:
# {
#   "type": "REJECT_ASSIGNMENT",
#   "data": {
#     "deliveryId": "YOUR_DELIVERY_ID_HERE",
#     "reason": "Vehicle issue"
#   }
# }
#
# Complete Delivery:
# {
#   "type": "COMPLETE_DELIVERY",
#   "data": {
#     "deliveryId": "YOUR_DELIVERY_ID_HERE"
#   }
# }
#
# ------------------------------------------------------------------------------
# 7. DRIVER ASSIGNMENT OFFER PUSH (Server -> Driver WebSocket)
# ------------------------------------------------------------------------------
# When a delivery is created or retried, the nearest available driver receives
# this message directly over their open WebSocket connection (TTL = 30 seconds):
#
# {
#   "type": "ASSIGNMENT_OFFERED",
#   "data": {
#     "assignmentId": "354294205775876096-driver-uuid",
#     "deliveryId": "354294205775876096",
#     "driverId": "driver-uuid",
#     "expiresAt": "2026-09-22T11:45:00Z",
#     "distanceMeters": 1420.5,
#     "pickupAddress": { "city": "Cairo", "country": "EG", "location": { "lat": 30.0444, "lon": 31.2357 } },
#     "dropoffAddress": { "city": "Giza", "country": "EG", "location": { "lat": 30.0131, "lon": 31.2089 } },
#     "amount": "25.50",
#     "currency": "USD"
#   }
# }
#
# The driver can accept via GraphQL mutation `acceptAssignment` or WS message `ACCEPT_ASSIGNMENT`.
#
# ------------------------------------------------------------------------------
# 8. DRIVER SEARCH RETRY PUSH (Server -> Customer Delivery Subscribers)
# ------------------------------------------------------------------------------
# If an offered driver rejects the offer or 30 seconds pass without response:
# Customer receives notification that the system is re-dispatching to the next driver:
#
# {
#   "type": "DRIVER_SEARCH_RETRY",
#   "data": {
#     "deliveryId": "354294205775876096",
#     "driverId": null,
#     "status": "SEARCHING_RETRY",
#     "reason": "Driver rejected assignment"
#   }
# }
#
# If no driver accepts within 10 minutes, the customer receives DELIVERY_CANCELLED
# and payment is automatically refunded via SAGA step.
