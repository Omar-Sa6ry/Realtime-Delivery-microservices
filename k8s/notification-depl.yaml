apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
        - name: notification
          image: delivery/notification 
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          ports:
            - containerPort: 4004 
            - containerPort: 50053
          startupProbe:
            httpGet:
              path: /notification/health
              port: 4004
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /notification/health
              port: 4004
            periodSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /notification/health
              port: 4004
            initialDelaySeconds: 5
            periodSeconds: 20
            failureThreshold: 6
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"
            - name: PORT_NOTIFICATION
              value: '4004'
              
            - name: DB_HOST
              value: 'notification-db-srv'

            - name: DB_PORT
              value: '5432'

            - name: DB_NAME
              value: 'delivery_notification_db'

            - name: NODE_ENV
              value: 'development'

            - name: JWT_EXPIRE
              value: '36000s'

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: JWT_SECRET

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: POSTGRES_PASSWORD
          
            - name: REDIS_HOST
              value: 'redis-srv'

            - name: REDIS_PORT
              value: '6379'

            - name: REDIS_DB
              value: '0'

            - name: NATS_URL
              value: 'nats://nats-srv:4222'
              
            - name: KAFKA_BROKERS
              value: 'kafka-srv:9092'
              
            - name: KAFKA_GROUP_ID
              value: 'notification-service'
              
            - name: EMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: EMAIL_USER
            - name: EMAIL_PASS
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: EMAIL_PASS
            - name: EMAIL_SENDER
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: EMAIL_SENDER
            - name: FIREBASE_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: FIREBASE_PROJECT_ID
            - name: FIREBASE_CLIENT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: FIREBASE_CLIENT_EMAIL
            - name: FIREBASE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: FIREBASE_PRIVATE_KEY
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: TWILIO_ACCOUNT_SID
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: TWILIO_AUTH_TOKEN
            - name: TWILIO_FROM_NUMBER
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: TWILIO_FROM_NUMBER
            - name: ONESIGNAL_APP_ID
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: ONESIGNAL_APP_ID
            - name: ONESIGNAL_REST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: ONESIGNAL_REST_API_KEY
            - name: WEB_PUSH_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: WEB_PUSH_PUBLIC_KEY
            - name: WEB_PUSH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: WEB_PUSH_PRIVATE_KEY

---
apiVersion: v1
kind: Service
metadata:
  name: notification-srv
spec:
  selector:
    app: notification
  ports:
    - name: http
      protocol: TCP
      port: 4004
      targetPort: 4004
    - name: grpc
      protocol: TCP
      port: 50053
      targetPort: 50053
