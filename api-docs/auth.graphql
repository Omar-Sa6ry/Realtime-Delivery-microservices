# Refresh the access token (Public)
mutation {
  refreshToken(input: { refreshToken: "YOUR_REFRESH_TOKEN_HERE" }) {
    statusCode
    message
    success
    data {
      accessToken
      refreshToken
      user {
        id
        email
      }
    }
  }
}

