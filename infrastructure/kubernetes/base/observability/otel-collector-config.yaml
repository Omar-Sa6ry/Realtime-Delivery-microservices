apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: default
data:
  otel-collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      # Collect stdout/stderr from every pod on this node.
      # Kubernetes metadata (pod name, namespace, labels) is enriched via operators.
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/*/otel-collector*/*.log
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
          - type: router
            id: get-format
            routes:
              - output: parser-docker
                expr: 'body matches "^\\{"'
              - output: parser-crio
                expr: 'body matches "^[^ Z]+ "'
            default: move-message
          - type: json_parser
            id: parser-docker
            output: extract-metadata-from-filepath
            timestamp:
              parse_from: attributes.time
              layout: '%Y-%m-%dT%H:%M:%S.%LZ'
          - type: regex_parser
            id: parser-crio
            regex: '^(?P<time>[^ Z]+) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)$'
            output: extract-metadata-from-filepath
            timestamp:
              parse_from: attributes.time
              layout_type: gotime
              layout: '2006-01-02T15:04:05.999999999Z07:00'
          - type: move
            id: move-message
            from: body
            to: attributes.log
            output: extract-metadata-from-filepath
          - type: regex_parser
            id: extract-metadata-from-filepath
            regex: '^.*\/(?P<namespace>[^_]+)_(?P<pod_name>[^_]+)_(?P<uid>[a-f0-9\-]+)\/(?P<container_name>[^\._]+)\/(?P<restart_count>\d+)\.log$'
            parse_from: attributes["log.file.path"]
            cache:
              size: 128
          - type: move
            from: attributes.log
            to: body
          - type: add
            field: resource["k8s.pod.name"]
            value: EXPR(attributes.pod_name)
          - type: add
            field: resource["k8s.namespace.name"]
            value: EXPR(attributes.namespace)
          - type: add
            field: resource["k8s.container.name"]
            value: EXPR(attributes.container_name)

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
      batch:
        timeout: 5s
        send_batch_size: 512

    exporters:
      # Traces are stored in Tempo so they can be explored from Grafana.
      otlp/tempo:
        endpoint: tempo-srv:4317
        tls:
          insecure: true
      # OTLP metrics are forwarded to Prometheus via remote_write so they appear
      # in the same datasource as scrape-based metrics and trigger alert rules.
      prometheusremotewrite:
        endpoint: "http://prometheus-srv:9090/api/v1/write"
        tls:
          insecure_skip_verify: true
      # Logs are pushed to Loki for centralized search in Grafana.
      loki:
        endpoint: http://loki-srv:3100/loki/api/v1/push
        default_labels_enabled:
          exporter: false
          job: true
      debug:
        verbosity: basic

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheusremotewrite, debug]
        logs:
          receivers: [otlp, filelog]
          processors: [memory_limiter, batch]
          exporters: [loki]

