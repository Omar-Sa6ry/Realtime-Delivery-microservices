apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.18.0
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1.5Gi"
          ports:
            - containerPort: 9200
              name: http
            - containerPort: 9600
              name: performance
          env:
            - name: discovery.type
              value: single-node
            - name: plugins.security.disabled
              value: "true"
            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              value: "Admin_12345678"
            - name: "OPENSEARCH_JAVA_OPTS"
              value: "-Xms512m -Xmx512m"
            - name: "DISABLE_INSTALL_DEMO_CONFIG"
              value: "true"
            - name: "bootstrap.memory_lock"
              value: "false"
          startupProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-srv
spec:
  selector:
    app: opensearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
