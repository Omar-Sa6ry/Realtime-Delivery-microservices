# ─── QUERIES ───────────────────────────────────────────────

# Autocomplete Suggestions (Single Item Envelope)
query Autocomplete {
  autocomplete(
    input: {
      prefix: "high"
      index: "media"
      limit: 5
    }
  ) {
    success
    statusCode
    message
    timeStamp
    data {
      suggestions
    }
  }
}

# Search Users (Admin only; requires x-user-id and role admin) - Paginated Collection Envelope
query SearchUsers {
  searchUsers(
    input: {
      query: "omarrrr"
      role: "user"
      isActive: true
      pagination: { limit: 4 }
    }
  ) {
    success
    statusCode
    message
    timeStamp
    data {
      paginationInfo {
        totalItems
        currentPage
        nextPage
      }
      items {
        id
        first_name
        last_name
        email
        role
        is_active
        created_at
      }
    }
  }
}

# Search Media (requires authentication) - Paginated Collection Envelope
query SearchMedia {
  searchMedia(
    input: {
      query: "High"
      pagination: { limit: 10 }
    }
  ) {
    success
    statusCode
    message
    timeStamp
    data {
      paginationInfo {
        totalItems
        currentPage
        nextPage
      }
      items {
        media_id
        file_name
        mime_type
        owner_id
        size
        status
        created_at
      }
    }
  }
}

# Search Deliveries - Paginated Collection Envelope
query SearchDeliveries {
  searchDeliveries(
    input: {
      query: "Cairo"
      status: "CREATED"
      pagination: { limit: 10 }
    }
  ) {
    success
    statusCode
    message
    timeStamp
    data {
      paginationInfo {
        totalItems
        currentPage
        nextPage
      }
      items {
        delivery_id
        customer_id
        driver_id
        status
        pickup {
          city
          country
          location {
            lat
            lon
          }
        }
        dropoff {
          city
          country
          location {
            lat
            lon
          }
        }
        created_at
        updated_at
        source_version
      }
    }
  }
}

