services:
  clamav-srv:
    image: clamav/clamav:1.4
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 2 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
    expose:
      - "3310"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../observability/otel/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    # The image entrypoint is /bin/alertmanager and it does not expand
    # environment variables, so a tiny renderer materialises the receivers
    # block from ALERT_WEBHOOK_URL first.
    entrypoint: ["/bin/sh", "/usr/local/bin/docker-entrypoint.sh"]
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://alertmanager-discord:8080/webhook}
    volumes:
      - ../observability/alertmanager/alertmanager.yml.tmpl:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - ../observability/alertmanager/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    depends_on:
      - alertmanager-discord
    restart: unless-stopped

  alertmanager-discord:
    build:
      context: ../observability/discord-relay
    image: delivery/alertmanager-discord:local
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      PORT: "8080"
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 45s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

  media-service:
    depends_on:
      clamav-srv:
        condition: service_healthy
      otel-collector:
        condition: service_started
      prometheus:
        condition: service_started
    environment:
      CLAMAV_HOST: clamav-srv
      CLAMAV_PORT: "3310"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_SERVICE_NAME: media-service
      TRACE_SAMPLE_RATIO: "0.10"

  payment-service:
    depends_on:
      otel-collector:
        condition: service_started
    environment:
      OTEL_ENDPOINT: otel-collector:4317

  analytics-service:
    depends_on:
      otel-collector:
        condition: service_started
    environment:
      OTEL_ENDPOINT: otel-collector:4317

  search-service:
    depends_on:
      otel-collector:
        condition: service_started
    environment:
      OTEL_ENDPOINT: otel-collector:4317

  driver-service:
    depends_on:
      otel-collector:
        condition: service_started
    environment:
      OTEL_ENDPOINT: otel-collector:4317

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  tempo_data:
