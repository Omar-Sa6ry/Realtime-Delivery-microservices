# DRIVER SERVICE — GraphQL Operations Reference
# Port: 4008 | Subgraph: /driver/graphql
# ============================================================

# ─── QUERIES ───────────────────────────────────────────────

# Get Driver Service Health
query GetDriverServiceInfo {
  driverServiceInfo {
    success
    statusCode
    message
    timeStamp
    data { name  version  status }
  }
}

# Get Driver by ID - WRAPPED response
query GetDriver {
  driver(id: "driver-123") {
    success
    statusCode
    message
    timeStamp
    data {
      id
      user {
        id
      }
      status        # OFFLINE | AVAILABLE | BUSY
      vehicleType   # CAR | MOTORCYCLE | TRUCK | BICYCLE | VAN
      plateNumber
      capacityKg
      capabilities
      serviceArea
      rating
      isBlocked
      createdAt
      updatedAt
    }
  }
}

# Get My Driver Profile (authenticated driver) - WRAPPED response
query GetMyDriverProfile {
  myDriverProfile {
    success
    statusCode
    message
    timeStamp
    data {
      id
      user {
        id
      }
      status
      vehicleType
      plateNumber
      capacityKg
      capabilities
      serviceArea
      rating
      isBlocked
      createdAt
      updatedAt
    }
  }
}

# Get Driver Active Assignment - WRAPPED response
query GetDriverActiveAssignment {
  driverActiveAssignment(driverId: "driver-123") {
    success
    statusCode
    message
    timeStamp
    data {
      id
      delivery {
        id
      }
      driver {
        id
      }
      status        # OFFERED|ACCEPTED|ACTIVE|COMPLETED|REJECTED|EXPIRED|CANCELLED
      attemptNumber
      offeredAt
      expiresAt
      acceptedAt
      rejectedAt
      completedAt
      createdAt
      updatedAt
    }
  }
}

# Get Driver Status - WRAPPED response
query GetDriverStatus {
  driverStatus(driverId: "driver-123") {
    success
    statusCode
    message
    timeStamp
    data {
      driver {
        id
      }
      status
      hasActiveAssignment
      activeDelivery {
        id
      }
      lastSeenAt
    }
  }
}

# Get Nearby Drivers - WRAPPED response
query GetNearbyDrivers {
  nearbyDrivers(input: {
    latitude: 30.0444
    longitude: 31.2357
    radiusKm: 5.0
    vehicleType: CAR
    limit: 10
  }) {
    success
    statusCode
    message
    timeStamp
    data {
      paginationInfo {
        totalItems
        currentPage
        nextPage
      }
      items {
        driver {
          id
          rating
          isBlocked
        }
        distanceMeters
        status
        vehicleType
        latitude
        longitude
        rating
        isBlocked
      }
    }
  }
}

# Get Assignment by ID - WRAPPED response
query GetAssignment {
  assignment(id: "assignment-123") {
