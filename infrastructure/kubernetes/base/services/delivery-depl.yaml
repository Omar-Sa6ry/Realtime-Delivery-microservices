apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-depl
spec:
  replicas: 1
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      app: delivery
  template:
    metadata:
      labels:
        app: delivery
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4003"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              until nc -z -w 3 delivery-db-srv 5432;
              do echo "Waiting for delivery-db-srv:5432..."; sleep 2; done;
              echo "Database is reachable!"
      containers:
        - name: delivery
          image: delivery/delivery
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "10m"
              memory: "10Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          ports:
            - name: http
              containerPort: 4003
            - name: grpc
              containerPort: 50054
          startupProbe:
            httpGet:
              path: /health/live
              port: 4003
            initialDelaySeconds: 120
            periodSeconds: 5
            failureThreshold: 120
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4003
            initialDelaySeconds: 120
            periodSeconds: 3
            failureThreshold: 120
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4003
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 120
            timeoutSeconds: 5
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"
            - name: PORT_DELIVERY
              value: "4003"
            - name: PORT_DELIVERY_GRPC
              value: "50054"
            - name: DB_HOST
              value: delivery-db-srv
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: delivery_delivery_db
            - name: NODE_ENV
              value: development
            - name: SERVICE_NAME
              value: delivery-service
            - name: JWT_EXPIRE
              value: 36000s
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: delivery-secrets
                  key: JWT_SECRET
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: delivery-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: delivery-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_HOST
              value: redis-srv
            - name: REDIS_PORT
              value: "6379"
            - name: NATS_URL
              value: nats://nats-srv:4222
            - name: KAFKA_BROKERS
              value: kafka-srv:9092
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_URL
            - name: OTEL_ENDPOINT
              value: "otel-collector-srv:4317"
            - name: ALERTMANAGER_URL
              value: "http://alertmanager-srv:9093"
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-srv
spec:
  selector:
    app: delivery
  ports:
    - name: http
      protocol: TCP
      port: 4003
      targetPort: http
    - name: grpc
      protocol: TCP
      port: 50054
      targetPort: grpc