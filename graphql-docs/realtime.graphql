# }

# Scenario 2: DRIVER_SEARCH_RETRY (Server -> Customer WebSocket)
# Pushed when no drivers are currently nearby, or when candidate rejects / offer expires (30s):
# {
#   "type": "DRIVER_SEARCH_RETRY",
#   "timestamp": "2026-09-24T12:00:30Z",
#   "data": {
#     "deliveryId": "354294205775876096",
#     "customerId": "cust-uuid",
#     "driverId": null,
#     "status": "SEARCHING_RETRY",
#     "reason": "NO_DRIVERS_NEARBY",
#     "retryInterval": 30
#   }
# }

# Scenario 3: DRIVER_ASSIGNED & DRIVER_ACCEPTED (Server -> Customer WebSocket)
# Pushed immediately when driver accepts offer via WebSocket REJECT_ASSIGNMENT/ACCEPT_ASSIGNMENT or selfAcceptDelivery GraphQL:
# {
#   "type": "DRIVER_ASSIGNED",
#   "timestamp": "2026-09-24T12:01:15Z",
#   "data": {
#     "deliveryId": "354294205775876096",
#     "driverId": "driver-uuid",
#     "status": "DRIVER_ACCEPTED"
#   }
# }

# Scenario 4: SELF-ACCEPT / OPEN DELIVERIES BROWSE (Driver GraphQL)
# Driver browses available unassigned or rejected deliveries using availableDeliveries:
# query { availableDeliveries { items { id status amount pickupCity dropoffCity } } }
# And claims any with:
# mutation { selfAcceptDelivery(deliveryId: "354294205775876096", idempotencyKey: "...") { success statusCode } }

# Scenario 5: DELIVERY_CANCELLED & PAYMENT REFUNDED (Server -> Customer WS + Push Notification)
# Pushed when 10-minute timeout is reached without driver assignment; full payment refund issued:
# {
#   "type": "DELIVERY_CANCELLED",
#   "timestamp": "2026-09-24T12:10:00Z",
#   "data": {
#     "deliveryId": "354294205775876096",
#     "status": "CANCELLED",
#     "paymentStatus": "REFUNDED",
#     "reason": "NO_DRIVER_FOUND_TIMEOUT"
#   }
# }