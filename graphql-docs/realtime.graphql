# Scenario 1: ASSIGNMENT_OFFERED (Server -> Driver WebSocket)
# Pushed to nearest online driver within pickup radius. Driver has 30s to respond.
# {
#   "type": "ASSIGNMENT_OFFERED",
#   "timestamp": "2026-09-24T12:00:00Z",
#   "data": {
