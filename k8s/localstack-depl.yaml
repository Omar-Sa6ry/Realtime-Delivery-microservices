apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack-depl
  namespace: default
  labels:
    app: localstack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
      - name: localstack
        image: localstack/localstack:3.8.0
        ports:
        - containerPort: 4566
        env:
        - name: SERVICES
          value: "s3,dynamodb"
        - name: DEFAULT_REGION
          value: "us-east-1"
        - name: PERSISTENCE
          value: "0" # Memory-only for fast tests
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1536Mi"
        startupProbe:
          tcpSocket:
            port: 4566
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: 4566
          initialDelaySeconds: 20
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          tcpSocket:
            port: 4566
          initialDelaySeconds: 120
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: localstack-srv
  namespace: default
spec:
  selector:
    app: localstack
  ports:
  - name: edge
    port: 4566
    targetPort: 4566
    protocol: TCP
  type: ClusterIP
