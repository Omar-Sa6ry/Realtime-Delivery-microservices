# RabbitMQ broker config — mounted to /etc/rabbitmq/rabbitmq.conf
# Compatible with rabbitmq:3.13-management-alpine

loopback_users.guest = false

# Network / protocol tuning
listeners.tcp.1 = 5672
management.tcp.port = 15672
heartbeat = 30
channel_max = 2047
connection_max = 2048

# Memory / disk alarms (suitable for local dev + small k8s pods)
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# Queue defaults: lazy queues save RAM for bursty delivery workloads
default_queue_type = quorum
quorum_cluster_size = 1

# Promote Prometheus metrics (needs rabbitmq_prometheus plugin)
prometheus.tcp.port = 15692

# Load initial topology (vhosts/users/exchanges/queues/bindings/policies)
# definitions file is mounted to /etc/rabbitmq/definitions.json
load_definitions = /etc/rabbitmq/definitions.json

# Logging
log.console = true
log.console.level = info
log.connection.level = warning
log.channel.level = warning
log.queue.level = warning
