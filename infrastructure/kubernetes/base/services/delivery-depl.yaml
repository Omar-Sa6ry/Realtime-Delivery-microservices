apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: delivery
  template:
    metadata:
      labels:
        app: delivery
    spec:
      containers:
        - name: delivery
          image: delivery/delivery
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4003
            - name: grpc
              containerPort: 50054
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 180
            periodSeconds: 5
            failureThreshold: 240
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 3
            failureThreshold: 120
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
            timeoutSeconds: 5
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"
            - name: PORT_DELIVERY
              value: "4003"
            - name: PORT_DELIVERY_GRPC
              value: "50054"
            - name: PORT_METRICS
              value: "9104"
            - name: DB_HOST
              value: delivery-db-srv
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: delivery_delivery_db
            - name: NODE_ENV
              value: development
            - name: JWT_EXPIRE
              value: 36000s
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: delivery-secrets
                  key: JWT_SECRET
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: delivery-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: delivery-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_HOST
              value: redis-srv
            - name: REDIS_PORT
              value: "6379"
            - name: NATS_URL
              value: nats://nats-srv:4222
            - name: KAFKA_BROKERS
              value: kafka-srv:9092
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-srv
spec:
  selector:
    app: delivery
  ports:
    - name: http
      protocol: TCP
      port: 4003
      targetPort: http
    - name: grpc
      protocol: TCP
      port: 50054
      targetPort: grpc
