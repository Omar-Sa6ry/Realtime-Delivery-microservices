# Get Driver Reviews (Admin) - WRAPPED response
query GetDriverReviews {
  driverReviews(driverId: "598a51a0-240e-4154-82c8-1b040f0c36a4", page: 1, limit: 10) {
    success
    statusCode
    message
    timeStamp
    data {
      paginationInfo {
        totalItems
        currentPage
        nextPage
      }
      items {
        id
        user {
          id
        }
        delivery {
          id
        }
        rating
        comment
        createdAt
      }
      averageRating
      totalReviews
    }
  }
}
