syntax = "proto3";
package payment;

service PaymentService {
  rpc AuthorizePayment (PaymentRequest) returns (PaymentResponse);
  rpc RefundPayment (RefundPaymentRequest) returns (PaymentResponse);
  rpc GetPaymentStatus (PaymentStatusRequest) returns (PaymentResponse);
}

message PaymentRequest { 
  string deliveryId = 1; 
  string customerId = 2; 
  double amount = 3; 
  string currency = 4; 
  string idempotencyKey = 5; 
}

message RefundPaymentRequest { 
  string deliveryId = 1; 
  string reason = 2; 
}

message PaymentStatusRequest { 
  string deliveryId = 1; 
}

message PaymentResponse { 
  bool success = 1; 
  string paymentId = 2; 
  string deliveryId = 3; 
  string status = 4; 
  double amount = 5; 
  string currency = 6; 
  string failureReason = 7; 
}
