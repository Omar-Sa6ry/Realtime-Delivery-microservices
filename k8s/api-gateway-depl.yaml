apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: delivery/api-gateway
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          ports:
            - containerPort: 4000
              name: http
            - containerPort: 4099
              name: liveness
          startupProbe:
            httpGet:
              path: /
              port: 4099
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 240
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /
              port: 4099
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 6
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"
            - name: PORT_GATEWAY
              value: "4000"
            - name: PORT_LIVENESS
              value: "4099"
            - name: NODE_ENV
              value: "development"
            - name: REDIS_HOST
              value: "redis-srv"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_DB
              value: "0"
            - name: RATE_LIMIT_LIMIT
              value: "100"
            - name: RATE_LIMIT_WINDOW_MS
              value: "60000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: JWT_SECRET
            - name: MEDIA_SUBGRAPH_URL
              value: "http://media-srv:4005/media/graphql"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-srv:4004/notification/graphql"
            - name: USER_SERVICE_URL
              value: "http://user-srv:4001/user/graphql"
            - name: REALTIME_SERVICE_URL
              value: "http://realtime-srv:4006/realtime/graphql"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-srv
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      protocol: TCP
      port: 4000
      targetPort: 4000


