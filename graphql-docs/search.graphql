# ─── MUTATIONS ──────────────────────────────────────────────

# Start Reindexing (Admin only) - Single Item Envelope
mutation StartReindex {
  startReindex(index: "deliveries") {
    success
    statusCode
    message
    timeStamp
    data {
      jobId
      index
      status
      startedAt
      completedAt
      error
    }
  }
}
