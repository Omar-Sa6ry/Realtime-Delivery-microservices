apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: driver-db-srv
  namespace: default
spec:
  serviceName: driver-db-srv
  replicas: 1
  selector:
    matchLabels:
      app: driver-db
  template:
    metadata:
      labels:
        app: driver-db
    spec:
      containers:
      - name: mongodb
        image: mongo:7
        args: ["--bind_ip", "0.0.0.0"]
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: data
          mountPath: /data/db
        startupProbe:
          exec:
            command: ['mongosh', '--eval', 'db.runCommand({ping:1})']
          initialDelaySeconds: 3
          periodSeconds: 3
          timeoutSeconds: 5
          failureThreshold: 120
        readinessProbe:
          exec:
            command: ['mongosh', '--eval', 'db.runCommand({ping:1})']
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 30
        livenessProbe:
          exec:
            command: ['mongosh', '--eval', 'db.runCommand({ping:1})']
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: driver-db-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: driver-db-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: standard
---
apiVersion: v1
kind: Service
metadata:
  name: driver-db-srv
  namespace: default
  labels:
    app: driver-db
spec:
  selector:
    app: driver-db
  ports:
  - name: mongodb
    protocol: TCP
    port: 27017
    targetPort: 27017