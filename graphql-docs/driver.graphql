# Get Driver Service Health (Public)
query GetDriverServiceInfo {
  driverServiceInfo {
    success
    statusCode
    message
    timeStamp
    data {
      name
      version
      status
    }
  }
}

# Register new Driver (User / Admin)
mutation RegisterDriver {
  registerDriver(
    input: {
      userId: "356369776609595392"
      plateNumber: "ABC-123"
      capacityKg: 50
      vehicleType: MOTORCYCLE
      capabilities: ["STANDARD"]
      serviceArea: "Cairo"
    }
  ) {
    success
    statusCode
    message
    data {
      id
      user {
        id
        email
        firstName
        lastName
        role
      }
      status
      vehicleType
      plateNumber
      createdAt
      capacityKg
      capabilities
      isActive
      isBlocked
      serviceArea
      updatedAt
    }
  }
}

