apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-depl
spec:
  replicas: 1
  progressDeadlineSeconds: 900
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4001"
        prometheus.io/path: "/user/metrics"
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              until nc -z -w 3 user-db-srv 5432;
              do echo "Waiting for user-db-srv:5432..."; sleep 2; done;
              echo "Database is reachable!"
      containers:
        - name: user
          image: delivery/user
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "10m"
              memory: "10Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          ports:
            - containerPort: 4001
            - containerPort: 50051
          startupProbe:
            httpGet:
              path: /user/health
              port: 4001
            initialDelaySeconds: 120
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /user/ready
              port: 4001
            initialDelaySeconds: 120
            periodSeconds: 3
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /user/health
              port: 4001
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 120
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"
            - name: PORT_USER
              value: "4001"

            - name: DB_HOST
              value: "user-db-srv"

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              value: "delivery_user_db"

            - name: NODE_ENV
              value: "development"

            - name: JWT_EXPIRE
              value: "36000s"

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: JWT_SECRET

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: POSTGRES_PASSWORD

            - name: REDIS_HOST
              value: "redis-srv"

            - name: REDIS_PORT
              value: "6379"

            - name: REDIS_DB
              value: "0"

            - name: NATS_URL
              value: "nats://nats-srv:4222"

            - name: KAFKA_BROKERS
              value: "kafka-srv:9092"
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_URL
            - name: SERVICE_NAME
              value: "user-service"
            - name: OTEL_ENDPOINT
              value: "otel-collector-srv:4317"
            - name: ALERTMANAGER_URL
              value: "http://alertmanager-srv:9093"
---
apiVersion: v1
kind: Service
metadata:
  name: user-srv
spec:
  selector:
    app: user
  ports:
    - name: http
      protocol: TCP
      port: 4001
      targetPort: 4001
    - name: grpc
      protocol: TCP
      port: 50051
      targetPort: 50051
