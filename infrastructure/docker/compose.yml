

services:
  # --- Infrastructure ---
  redis-srv:
    image: redis:alpine
    pull_policy: missing
    container_name: redis-srv
    ports:
      - "6379:6379"

  nats-srv:
    image: nats-streaming:0.17.0
    pull_policy: missing
    container_name: nats-srv
    command: ["-p", "4222", "-m", "8222", "-hbi", "5s", "-hbt", "5s", "-hbf", "2", "-SD", "-cid", "ticketing"]
    ports:
      - "4222:4222"
      - "8222:8222"

  user-db-srv:
    image: postgres:15
    pull_policy: missing
    container_name: user-db-srv
    env_file:
      - ../../config/env/.env.${APP_ENV:-development}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-delivery_user_db}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data

  notification-db-srv:
    image: postgres:15
    pull_policy: missing
    container_name: notification-db-srv
    env_file:
      - ../../config/env/.env.${APP_ENV:-development}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-delivery_notification_db}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5434:5432"
    volumes:
      - notification_db_data:/var/lib/postgresql/data

  kafka-srv:
    image: apache/kafka:3.8.0
    container_name: kafka-srv
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-srv:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-srv:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

  localstack-srv:
    image: localstack/localstack:latest
    container_name: localstack-srv
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,dynamodb
      - DEFAULT_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - PERSISTENCE=0
    volumes:
      - ../localstack/init:/etc/localstack/init/ready.d:ro

  # --- Microservices ---
  user-service:
    build:
      context: ../..
      dockerfile: services/user-service/Dockerfile
    container_name: user-service
    restart: always
    env_file:
      - ../../config/env/.env.${APP_ENV:-development}
    ports:
      - "4001:4001"
      - "50051:50051"
    networks:
      default:
        aliases:
          - user-srv
    environment:
      PORT_USER: ${PORT_USER:-4001}
      DB_HOST: "user-db-srv"
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-delivery_user_db}
      DB_USERNAME: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE:-36000s}
      REDIS_HOST: "redis-srv"
      REDIS_PORT: ${REDIS_PORT:-6379}
      NATS_URL: ${NATS_URL:-nats://nats-srv:4222}
      MEDIA_SERVICE_GRPC_URL: ${MEDIA_SERVICE_GRPC_URL:-media-srv:50052}
    depends_on:
      - user-db-srv
      - redis-srv
      - nats-srv
    volumes:
      - ../../services/user-service/src:/usr/src/app/services/user-service/src
      - ../../packages/ts:/usr/src/app/packages/ts

  media-service:
    build:
      context: ../..
      dockerfile: services/media-service/Dockerfile
    container_name: media-service
    restart: always
    env_file:
      - ../../config/env/.env.${APP_ENV:-development}
    ports:
      - "4005:4005"
      - "4009:4003"
      - "9102:9102"
      - "50052:50052"
    networks:
      default:
        aliases:
          - media-srv
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT_MEDIA_GRAPHQL: "4005"
      PORT_MEDIA_WS: "4003"
      PORT_MEDIA_METRICS: "9102"
      PORT_MEDIA_GRPC: "50052"
      AWS_REGION: "us-east-1"
      # Use host.docker.internal so S3 presigned URLs are reachable from the
      # browser (LocalStack is published on the host at 4566).
      AWS_ENDPOINT: "http://host.docker.internal:4566"
      DYNAMODB_ENDPOINT: "http://localstack-srv:4566"
      DYNAMODB_TABLE_NAME: "media-service"
      REDIS_HOST: "redis-srv"
      REDIS_PORT: "6379"
      KAFKA_BROKERS: "kafka-srv:9092"
      KAFKA_GROUP_ID: "media-service"
      KAFKA_TOPIC_PREFIX: "media"
      MEDIA_MAX_FILE_SIZE_BYTES: "53687091200"
      MEDIA_MAX_CONCURRENT_UPLOADS: "5"
      MEDIA_STORAGE_QUOTA_BYTES: "53687091200"
      MEDIA_UPLOAD_SESSION_TTL: "86400"
      S3_PRESIGNED_URL_EXPIRY: "3600"
      S3_MULTIPART_MIN_PART_SIZE: "5242880"
      S3_LIFECYCLE_ABORT_DAYS: "7"
      S3_BUCKET_NAME: "delivery-media-development"
      MEDIA_SCAN_WORKERS: "4"
      MEDIA_IMAGE_WORKERS: "4"
      MEDIA_VIDEO_WORKERS: "2"
      MEDIA_DELETE_WORKERS: "4"
      MEDIA_OUTBOX_WORKERS: "2"
      MEDIA_COMPRESSION_WORKERS: "4"
      MEDIA_METADATA_WORKERS: "4"
      MEDIA_RECONCILE_INTERVAL: "300"
      MEDIA_STUCK_UPLOAD_TIMEOUT: "3600"
      MEDIA_STUCK_PROCESSING_TIMEOUT: "7200"
      MEDIA_RATE_LIMIT_UPLOAD_PER_MINUTE: "10"
      MEDIA_RATE_LIMIT_DOWNLOAD_PER_MINUTE: "60"
      CLAMAV_HOST: "clamav-srv"
      CLAMAV_PORT: "3310"
      FFMPEG_BINARY: "/usr/bin/ffmpeg"
    depends_on:
      - redis-srv
      - localstack-srv
      - kafka-srv
    volumes:
      - ../../services/media-service/internal:/workspace/services/media-service/internal
      - ../../packages/go:/workspace/packages/go

  notification-service:
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    container_name: notification-service
    restart: always
    env_file:
      - ../../config/env/.env.${APP_ENV:-development}
    ports:
      - "4004:4004"
      - "50053:50053"
    networks:
      default:
        aliases:
          - notification-srv
    environment:
      PORT_NOTIFICATION: ${PORT_NOTIFICATION:-4004}
      PORT_GRPC: ${PORT_GRPC:-50053}
      DB_HOST: "notification-db-srv"
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${NOTIFICATION_DB_NAME:-delivery_notification_db}
      DB_USERNAME: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE:-36000s}
      REDIS_HOST: "redis-srv"
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      NATS_URL: ${NATS_URL:-nats://nats-srv:4222}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka-srv:9092}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-notification-service}
      EMAIL_SERVICE: ${EMAIL_SERVICE}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_SECURE: ${EMAIL_SECURE}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_SENDER: ${EMAIL_SENDER}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      AWS_SES_ACCESS_KEY_ID: ${AWS_SES_ACCESS_KEY_ID}
      AWS_SES_SECRET_ACCESS_KEY: ${AWS_SES_SECRET_ACCESS_KEY}
      AWS_SES_REGION: ${AWS_SES_REGION}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER}
      TWILIO_SMS_NUMBER: ${TWILIO_SMS_NUMBER}
      SMSMISR_USERNAME: ${SMSMISR_USERNAME}
      SMSMISR_PASSWORD: ${SMSMISR_PASSWORD}
      SMSMISR_SENDER: ${SMSMISR_SENDER}
      SMS_PROVIDER: ${SMS_PROVIDER}
      SMSMISR_ENVIRONMENT: ${SMSMISR_ENVIRONMENT}
      VONAGE_API_KEY: ${VONAGE_API_KEY}
      VONAGE_API_SECRET: ${VONAGE_API_SECRET}
      VONAGE_SENDER: ${VONAGE_SENDER}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ENABLE_TELEGRAM_BOT: ${ENABLE_TELEGRAM_BOT}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_DEFAULT_CHANNEL: ${SLACK_DEFAULT_CHANNEL}
      ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID}
      ONESIGNAL_REST_API_KEY: ${ONESIGNAL_REST_API_KEY}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT}
      IN_APP_PROVIDER: ${IN_APP_PROVIDER}
      PUSHER_APP_ID: ${PUSHER_APP_ID}
      PUSHER_KEY: ${PUSHER_KEY}
      PUSHER_SECRET: ${PUSHER_SECRET}
      PUSHER_CLUSTER: ${PUSHER_CLUSTER}
      FIREBASE_PROJECT_ID: ${PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${PRIVATE_KEY}
    depends_on:
      - notification-db-srv
      - redis-srv
      - nats-srv
      - kafka-srv
    volumes:
      - ../../services/notification-service/src:/usr/src/app/services/notification-service/src
      - ../../packages/ts:/usr/src/app/packages/ts
      - ../../protos:/usr/src/app/protos

  realtime-service:
    build:
      context: ../..
      dockerfile: services/realtime-service/Dockerfile
    container_name: realtime-service
    restart: always
    env_file:
      - ../../config/env/.env.${APP_ENV:-development}
    ports:
      - "4006:4006"
    networks:
      default:
        aliases:
          - realtime-srv
    environment:
      PORT_REALTIME: ${PORT_REALTIME:-4006}
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE:-36000s}
      REDIS_HOST: "redis-srv"
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      NATS_URL: ${NATS_URL:-nats://nats-srv:4222}
      INSTANCE_ID: "realtime-docker"
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka-srv:9092}
      KAFKA_CLIENT_ID: "realtime-service"
      KAFKA_GROUP_ID: "realtime-service-group"
      WS_MAX_PAYLOAD: ${WS_MAX_PAYLOAD:-16384}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-*}
    depends_on:
      - redis-srv
      - nats-srv
      - kafka-srv
    volumes:
      - ../../services/realtime-service/src:/usr/src/app/services/realtime-service/src
      - ../../packages/ts:/usr/src/app/packages/ts
      - ../../protos:/usr/src/app/protos

  opensearch-srv:
    image: opensearchproject/opensearch:2.18.0
    container_name: opensearch-srv
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  search-service:
    build:
      context: ../..
      dockerfile: services/search-service/Dockerfile
    container_name: search-service
    restart: always
    env_file:
      - ../../config/env/.env.${APP_ENV:-development}
    ports:
      - "4007:4007"
      - "9103:9103"
    networks:
      default:
        aliases:
          - search-srv
    environment:
      PORT_SEARCH_GRAPHQL: "4007"
      PORT_SEARCH_METRICS: "9103"
      OPENSEARCH_URL: "http://opensearch-srv:9200"
      REDIS_HOST: "redis-srv"
      REDIS_PORT: ${REDIS_PORT:-6379}
      KAFKA_BROKERS: "kafka-srv:9092"
      NATS_URL: ${NATS_URL:-nats://nats-srv:4222}
    depends_on:
      - redis-srv
      - opensearch-srv
      - kafka-srv
    volumes:
      - ../../services/search-service:/app/services/search-service
      - ../../packages/go:/app/packages/go

  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    container_name: api-gateway
    restart: always
    env_file:
      - ../../config/env/.env.${APP_ENV:-development}
    ports:
      - "4000:4000"
    networks:
      default:
        aliases:
          - api-gateway-srv
    environment:
      PORT_GATEWAY: ${PORT_GATEWAY:-4000}
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_HOST: "redis-srv"
      REDIS_PORT: ${REDIS_PORT:-6379}
      RATE_LIMIT_LIMIT: ${RATE_LIMIT_LIMIT:-100}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      USER_SERVICE_URL: "http://user-srv:4001/user/graphql"
      MEDIA_SUBGRAPH_URL: "http://media-srv:4005/media/graphql"
      NOTIFICATION_SERVICE_URL: "http://notification-srv:4004/notification/graphql"
      REALTIME_SERVICE_URL: "http://realtime-srv:4006/realtime/graphql"
      SEARCH_SERVICE_URL: "http://search-srv:4007/search/graphql"
      DELIVERY_SERVICE_URL: "http://delivery-srv:4003/delivery/graphql"
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - redis-srv
      - user-service
      - media-service
      - notification-service
      - realtime-service
      - search-service
      - delivery-service
    volumes:
      - ../../services/api-gateway/src:/usr/src/app/services/api-gateway/src
      - ../../packages/ts:/usr/src/app/packages/ts

  delivery-db-srv:
    image: postgres:15
    pull_policy: missing
    container_name: delivery-db-srv
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${DELIVERY_DB_NAME:-delivery_delivery_db}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5435:5432"
    volumes:
      - delivery_db_data:/var/lib/postgresql/data

  delivery-service:
    build:
      context: ../..
      dockerfile: services/delivery-service/Dockerfile
    container_name: delivery-service
    restart: unless-stopped
    env_file:
      - ../../config/env/.env.${APP_ENV:-development}
    ports:
      - "4003:4003"
      - "50054:50054"
      - "9104:9104"
    networks:
      default:
        aliases:
          - delivery-srv
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT_DELIVERY: ${PORT_DELIVERY:-4003}
      PORT_DELIVERY_GRPC: ${PORT_DELIVERY_GRPC:-50054}
      PORT_METRICS: ${PORT_METRICS:-9104}
      DB_HOST: delivery-db-srv
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${DELIVERY_DB_NAME:-delivery_delivery_db}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE:-36000s}
      REDIS_HOST: redis-srv
      REDIS_PORT: ${REDIS_PORT:-6379}
      NATS_URL: ${NATS_URL:-nats://nats-srv:4222}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka-srv:9092}
      KAFKA_CLIENT_ID: delivery-service
      KAFKA_GROUP_ID: delivery-service-group
    depends_on:
      - delivery-db-srv
      - redis-srv
      - nats-srv
      - kafka-srv
    volumes:
      - ../../services/delivery-service/src:/usr/src/app/services/delivery-service/src
      - ../../packages/ts:/usr/src/app/packages/ts
      - ../../protos:/usr/src/app/protos

  # --- Driver Service ---
  driver-service:
    build:
      context: ../..
      dockerfile: services/driver-service/Dockerfile
    container_name: driver-service
    restart: unless-stopped
    env_file:
      - ../../config/env/.env.${APP_ENV:-development}
    ports:
      - "4008:4008"
      - "50055:50055"
      - "9105:9105"
    networks:
      default:
        aliases:
          - driver-srv
    environment:
      PORT_DRIVER_GRAPHQL: "4008"
      PORT_DRIVER_GRPC: "50055"
      PORT_DRIVER_METRICS: "9105"
      MONGODB_URI: "mongodb://driver-db-srv:27017"
      MONGODB_DATABASE: "driver_db"
      REDIS_HOST: "redis-srv"
      REDIS_PORT: "6379"
      KAFKA_BROKERS: "kafka-srv:9092"
      KAFKA_GROUP_ID: "driver-service"
      KAFKA_CLIENT_ID: "driver-service"
      NATS_URL: ${NATS_URL:-nats://nats-srv:4222}
      DISPATCH_SEARCH_RADIUS_KM: "5"
      ASSIGNMENT_TIMEOUT_SECONDS: "20"
      LOCATION_STALE_SECONDS: "30"
      LOCK_TTL_MS: "5000"
      MAX_DISPATCH_ATTEMPTS: "5"
      # LocalStack (for S3/DynamoDB - used by media-service pattern)
      AWS_DEFAULT_REGION: "us-east-1"
      AWS_ENDPOINT: "http://localstack-srv:4566"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
    depends_on:
      - delivery-db-srv
      - redis-srv
      - nats-srv
      - kafka-srv
      - localstack-srv
    volumes:
      - ../../services/driver-service:/app/services/driver-service
      - ../../packages/go:/app/packages/go
      - ../../protos:/usr/src/app/protos

volumes:
  delivery_db_data:
  user_db_data:
  notification_db_data:
  opensearch_data:



