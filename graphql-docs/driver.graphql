# Get Dispatch Attempts for a Delivery - WRAPPED response
query GetDispatchAttempts {
  dispatchAttempts(deliveryId: "delivery-123") {
    success
    statusCode
    message
    timeStamp
    data {
      paginationInfo {
        totalItems
        currentPage
