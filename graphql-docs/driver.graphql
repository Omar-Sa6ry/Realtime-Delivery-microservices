# Rate a Driver (User)
mutation RateDriver($input: RateDriverInput!) {
  rateDriver(input: $input) {
    success
    statusCode
    message
    timeStamp
    data {
      id
      driver {
        id
      }
      user {
        id
      }
      delivery {
        id
      }
      rating
      comment
      createdAt
    }
  }
}

