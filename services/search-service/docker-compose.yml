services:
  redis-srv:
    image: redis:alpine
    pull_policy: missing
    container_name: search-redis-srv
    ports:
      - "6379:6379"

  kafka-srv:
    image: apache/kafka:3.8.0
    pull_policy: missing
    container_name: search-kafka-srv
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-srv:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-srv:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

  nats-srv:
    image: nats-streaming:0.17.0
    pull_policy: missing
    container_name: search-nats-srv
    command: ["-p", "4222", "-m", "8222", "-hbi", "5s", "-hbt", "5s", "-hbf", "2", "-SD", "-cid", "ticketing"]
    ports:
      - "4222:4222"
      - "8222:8222"

  opensearch-srv:
    image: opensearchproject/opensearch:2.18.0
    pull_policy: missing
    container_name: search-opensearch-srv
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - search_opensearch_data:/usr/share/opensearch/data

  search-service:
    build:
      context: ../..
      dockerfile: services/search-service/Dockerfile
    container_name: search-service-local
    restart: unless-stopped
    env_file:
      - ../../config/env/.env.${APP_ENV:-development}
    ports:
      - "4007:4007"
      - "9103:9103"
    environment:
      PORT_SEARCH_GRAPHQL: "4007"
      PORT_SEARCH_METRICS: "9103"
      OPENSEARCH_URL: http://opensearch-srv:9200
      REDIS_HOST: redis-srv
      REDIS_PORT: "6379"
      KAFKA_BROKERS: kafka-srv:9092
      NATS_URL: ${NATS_URL:-nats://nats-srv:4222}
      APP_ENV: ${APP_ENV:-development}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      - redis-srv
      - opensearch-srv
      - kafka-srv
      - nats-srv
    volumes:
      - ./internal:/app/services/search-service/internal
      - ../../packages/go:/app/packages/go

volumes:
  search_opensearch_data:
