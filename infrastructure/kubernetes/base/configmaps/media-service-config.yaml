apiVersion: v1
kind: ConfigMap
metadata:
  name: media-service-config
  namespace: default
data:
  # Server
  PORT_MEDIA_GRAPHQL: "4005"
  PORT_MEDIA_METRICS: "9102"
  PORT_MEDIA_WS: "4003"
  NODE_ENV: "development"

  # AWS
  AWS_REGION: "us-east-1"
  AWS_ENDPOINT: "http://localstack-srv:4566"
  DYNAMODB_ENDPOINT: "http://localstack-srv:4566"

  # DynamoDB
  DYNAMODB_TABLE_NAME: "media-service"

  # Redis
  REDIS_HOST: "redis-srv"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_TTL: "3600"

  # Kafka
  KAFKA_BROKERS: "kafka-srv:9092"
  KAFKA_GROUP_ID: "media-service"
  KAFKA_TOPIC_PREFIX: "media"

  # Upload limits
  MEDIA_MAX_FILE_SIZE_BYTES: "53687091200"
  MEDIA_MAX_CONCURRENT_UPLOADS: "5"
  MEDIA_STORAGE_QUOTA_BYTES: "53687091200"
  MEDIA_UPLOAD_SESSION_TTL: "86400"
  MEDIA_ALLOWED_TYPES: >-
    image/jpeg,image/png,image/gif,image/webp,image/avif,
    video/mp4,video/quicktime,video/x-msvideo,video/webm,
    application/pdf,application/zip,text/plain

  # S3
  S3_PRESIGNED_URL_EXPIRY: "3600"
  S3_MULTIPART_MIN_PART_SIZE: "5242880"
  S3_LIFECYCLE_ABORT_DAYS: "7"
  S3_BUCKET_NAME: "delivery-micro"
  S3_PUBLIC_ENDPOINT: "http://localhost:4566"

  # Worker pool sizes
  MEDIA_SCAN_WORKERS: "4"
  MEDIA_IMAGE_WORKERS: "4"
  MEDIA_VIDEO_WORKERS: "2"
  MEDIA_DELETE_WORKERS: "4"
  MEDIA_OUTBOX_WORKERS: "2"
  MEDIA_COMPRESSION_WORKERS: "4"
  MEDIA_METADATA_WORKERS: "4"

  # Reconciliation
  MEDIA_RECONCILE_INTERVAL: "300"
  MEDIA_STUCK_UPLOAD_TIMEOUT: "3600"
  MEDIA_STUCK_PROCESSING_TIMEOUT: "7200"

  # Rate limiting
  MEDIA_RATE_LIMIT_UPLOAD_PER_MINUTE: "10"
  MEDIA_RATE_LIMIT_DOWNLOAD_PER_MINUTE: "60"

  # ClamAV
  CLAMAV_HOST: "clamav-srv"
  CLAMAV_PORT: "3310"

  # FFmpeg
  FFMPEG_BINARY: "/usr/bin/ffmpeg"

  # This development value is overridden by production configuration when needed.
  # Keep production secrets and credentials in Kubernetes Secrets, not this file.

