apiVersion: apps/v1
kind: Deployment
metadata:
  name: -depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: 
  template:
    metadata:
      labels:
        app: 
    spec:
      containers:
        - name: 
          image: delivery/ 
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          ports:
            - containerPort: 4003 
            - containerPort: 50051
          startupProbe:
            httpGet:
              path: //health
              port: 4003
            initialDelaySeconds: 180
            periodSeconds: 5
            failureThreshold: 240
          readinessProbe:
            httpGet:
              path: //ready
              port: 4003
            periodSeconds: 3
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: //health
              port: 4003
            initialDelaySeconds: 5
            periodSeconds: 20
            failureThreshold: 6
          env:
            - name: NODE_OPTIONS
              value: "--max-old-space-size=768"
            - name: PORT_DELIVERY
              value: '4003'
              
            - name: DB_HOST
              value: '-db-srv'

            - name: DB_PORT
              value: '5432'

            - name: DB_NAME
              value: 'delivery_user_db'

            - name: NODE_ENV
              value: 'development'

            - name: JWT_EXPIRE
              value: '36000s'

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: delivery-secrets
                  key: JWT_SECRET

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: delivery-secrets
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: delivery-secrets
                  key: POSTGRES_PASSWORD
          
            - name: REDIS_HOST
              value: 'redis-srv'

            - name: REDIS_PORT
              value: '6379'

            - name: REDIS_DB
              value: '0'

            - name: NATS_URL
              value: 'nats://nats-srv:4222'

            - name: KAFKA_BROKERS
              value: 'kafka-srv:9092'
---
apiVersion: v1
kind: Service
metadata:
  name: -srv
spec:
  selector:
    app: 
  ports:
    - name: http
      protocol: TCP
      port: 4003
      targetPort: 4003
    - name: grpc
      protocol: TCP
      port: 50051
      targetPort: 50051


