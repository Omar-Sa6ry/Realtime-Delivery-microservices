# ==============================================================================
# 🚀 Complete End-to-End Delivery & Payment Lifecycle Workflow
# ==============================================================================
# هذا الملف يوضح السيناريو الكامل خطوة بخطوة لدورة حياة الطلب والدفع والتتبع اللحظي (Real-time WebSockets).
# يشمل تدفق الـ Saga Pattern، الحجز المالي (Escrow Hold)، والتسليم وتأكيد الأرباح للسائق.
# ==============================================================================

# ------------------------------------------------------------------------------
# 📌 المعمارية ودورة حياة الطلب (Overview & Architecture)
# ------------------------------------------------------------------------------
# 1. السائق يصبح متاحاً (Go Online).
# 2. العميل يطلب دليفري جديد (Create Delivery) مع فحص رصيد/حجز المبلغ (Escrow Hold).
# 3. محرك الـ Dispatch يجد السائق المناسب ويبعث له العرض (Driver Active Assignment).
# 4. فتح اتصال WebSockets للعميل والسائق للتتبع المباشر وإرسال الموقع الجغرافي.
# 5. السائق يقبل الطلب (Accept Assignment) -> يُقفل الإلغاء على العميل تلقائياً.
# 6. تحديثات المراحل: استلام الطلب (PICKED_UP) -> جاري التوصيل (IN_TRANSIT).
# 7. إتمام التسليم (DELIVERED ثم COMPLETED):
#    - من الأفضل هندسياً؟ السائق يُرسل أنه وصل وسلّم (DELIVERED أو عبر COMPLETE_DELIVERY في الـ WebSocket)،
#      ثم العميل أو النظام يؤكد الاستلام (COMPLETED).
#    - عند الـ DELIVERED / COMPLETED: الـ Saga Pattern يقوم بسحب الأموال المحجوزة (Capture Escrow Payment)
#      وتسوية حساب السائق وإرسال الإشعارات اللحظية.
# ------------------------------------------------------------------------------

# ==============================================================================
# الخطوة 1: السائق يصبح متصلاً (Driver Goes Online)
# ==============================================================================
# Headers: Authorization: Bearer <DRIVER_JWT_TOKEN>
# الملف المرجعي: driver.graphql

mutation DriverGoOnline {
  goOnline(idempotencyKey: "go-online-driver-unique-key-001") {
    success
    statusCode
    message
    data {
      id
      status
      isActive
      vehicleType
      plateNumber
      serviceArea
      updatedAt
    }
  }
}

# ==============================================================================
# الخطوة 2: العميل ينشئ طلب التوصيل (Customer Creates Delivery)
# ==============================================================================
# Headers: Authorization: Bearer <CUSTOMER_JWT_TOKEN>
# الملف المرجعي: delivery.graphql
# ملاحظة هامة:
# بمجرد إنشاء الطلب، يبدأ الـ Saga Orchestrator بحجز المبلغ في الـ Payment Service (AUTHORIZE)
# إذا لم يتوفر المبلغ أو فشل الدفع، يُلغى الطلب وتفشل المعاملة.

mutation CustomerCreateDelivery {
  createDelivery(
    input: {
      amount: "25.50"
      currency: "USD"
      pickupAddress: {
        line1: "1 Main Street"
        line2: "Floor 3, Apt 12"
        city: "Cairo"
        state: "Cairo"
        postalCode: "11511"
        countryCode: "EG"
        latitude: 30.0444
        longitude: 31.2357
      }
      dropoffAddress: {
        line1: "2 Nile Corniche"
        line2: "Tower A"
        city: "Giza"
        state: "Giza"
        postalCode: "12511"
        countryCode: "EG"
        latitude: 30.0131
        longitude: 31.2089
      }
      idempotencyKey: "create-delivery-unique-key-001"
    }
  ) {
    success
    statusCode
    message
    timeStamp
    data {
      id
      status          # يبدأ بـ CREATED ثم ينتقل تلقائياً لـ PAYMENT_CONFIRMED
      paymentStatus   # PENDING ثم AUTHORIZED (محجوز في حساب الضمان Escrow)
      amount
      currency
      pickupAddress {
        line1
        city
        latitude
        longitude
      }
      dropoffAddress {
        line1
        city
        latitude
        longitude
      }
      createdAt
    }
  }
}

# ==============================================================================
# الخطوة 3: السائق يتحقق من العروض المسندة إليه (Driver Checks Active Assignment)
# ==============================================================================
# Headers: Authorization: Bearer <DRIVER_JWT_TOKEN>
# الملف المرجعي: driver.graphql

query GetDriverActiveAssignment {
  driverActiveAssignment {
    success
    statusCode
    message
    timeStamp
    data {
      id
      delivery {
        id
      }
      driver {
        id
      }
      status           # OFFERED
      attemptNumber
      offeredAt
      expiresAt
    }
  }
}

# ==============================================================================
# الخطوة 4: السائق يقبل العرض (Driver Accepts Assignment)
# ==============================================================================
# Headers: Authorization: Bearer <DRIVER_JWT_TOKEN>
# الملف المرجعي: driver.graphql
# ملاحظة أمنية وقانونية:
# بمجرد قبول السائق للطلب (DRIVER_ACCEPTED)، لا يحق للعميل إلغاء الطلب (Cancel Delivery)

mutation DriverAcceptAssignment {
  acceptAssignment(
    assignmentId: "<ASSIGNMENT_ID_FROM_STEP_3>"
    idempotencyKey: "accept-assignment-unique-key-001"
  ) {
    success
    statusCode
    message
    timeStamp
    data {
      id
      delivery {
        id
      }
      status           # ACCEPTED
      acceptedAt
    }
  }
}

# ==============================================================================
# الخطوة 5: متى وكيف نستخدم WebSockets والتتبع اللحظي؟ (Realtime WebSocket)
# ==============================================================================
# الملف المرجعي: websockets.graphql
# الرابط: ws://localhost:4000/ws?token=<JWT_TOKEN>
#
# متى يتم استخدامه؟
# فور إنشاء الطلب أو قبول السائق له:
# أ) العميل يشترك في غرفة الطلب ليستقبل موقع السائق وتغيرات الحالة لحظة بلحظة:
#    إرسال عبر WS:
#    {
#      "type": "SUBSCRIBE_DELIVERY",
#      "data": { "deliveryId": "<DELIVERY_ID>" }
#    }
#
# ب) السائق يرسل إحداثيات موقعه أثناء توجهه للمطعم/العميل كل بضع ثوانٍ:
#    إرسال عبر WS:
#    {
#      "type": "LOCATION_UPDATE",
#      "data": {
#        "deliveryId": "<DELIVERY_ID>",
#        "latitude": 30.0444,
#        "longitude": 31.2357,
#        "heading": 90.0,
#        "speed": 35.5
#      }
#    }
#
# النتيجة اللحظية:
# يقوم خادم Realtime (عبر NATS Pub/Sub) ببث الموقع وتحديثات الحالة للعميل المشترك فوراً.

# ==============================================================================
# الخطوة 6: دورة توصيل الطلب (Delivery Transitions: Pickup & Transit)
# ==============================================================================
# Headers: Authorization: Bearer <DRIVER_JWT_TOKEN> أو الأدمن
# الملف المرجعي: delivery.graphql

# 6.1 السائق استلم الشحنة (Picked Up)
mutation MarkDeliveryPickedUp {
  transitionDelivery(
    input: {
      deliveryId: "<DELIVERY_ID>"
      status: PICKED_UP
      note: "Package picked up from merchant"
    }
  ) {
    success
    statusCode
    message
    data {
      id
      status          # PICKED_UP
      pickedUpAt
    }
  }
}

# 6.2 السائق في الطريق للوجهة (In Transit)
mutation MarkDeliveryInTransit {
  transitionDelivery(
    input: {
      deliveryId: "<DELIVERY_ID>"
      status: IN_TRANSIT
      note: "Driver heading towards customer address"
    }
  ) {
    success
    statusCode
    message
    data {
      id
      status          # IN_TRANSIT
    }
  }
}

# ==============================================================================
# الخطوة 7: إتمام التوصيل وتسوية الأموال (Completion & Escrow Capture)
# ==============================================================================
# الأفضل في التطبيقات العالمية (مثل Uber Eats و DoorDash):
# 1) السائق هو من يعلن تسليم الطلب (DELIVERED) لأنه هو الموجود فعلياً في موقع التسليم.
# 2) النظام أو العميل يؤكد الاستلام (COMPLETED).
# 
# عند تحويل الحالة إلى DELIVERED أو COMPLETED:
# - يتم تلقائياً تفعيل Step 3 في Saga:
#   تقوم PaymentService بعمل CapturePayment لسحب المبلغ المحجوز ونقله لحساب السائق/السيستم.
# - يتحول paymentStatus من AUTHORIZED إلى COMPLETED.

# خيار أ: السائق يؤكد التسليم عبر GraphQL Mutation:
mutation MarkDeliveryDelivered {
  transitionDelivery(
    input: {
      deliveryId: "<DELIVERY_ID>"
      status: DELIVERED
      note: "Package handed over to recipient successfully"
    }
  ) {
    success
    statusCode
    message
    data {
      id
      status          # DELIVERED
      paymentStatus   # COMPLETED (تم خصم وتأكيد الدفع بنجاح)
      completedAt
    }
  }
}

# إغلاق الطلب نهائياً:
mutation CompleteDelivery {
  transitionDelivery(
    input: {
      deliveryId: "<DELIVERY_ID>"
      status: COMPLETED
      note: "Order confirmed and closed"
    }
  ) {
    success
    statusCode
    message
    data {
      id
      status          # COMPLETED
      paymentStatus   # COMPLETED
    }
  }
}

# خيار ب (بديل سريع لحظي عبر WebSockets):
# يمكن للسائق إرسال رسالة WS مباشرة لإتمام الطلب:
# {
#   "type": "COMPLETE_DELIVERY",
#   "data": {
#     "deliveryId": "<DELIVERY_ID>",
#     "commandId": "cmd-complete-12345678"
#   }
# }

# ==============================================================================
# الخطوة 8: سيناريوهات الإلغاء والاسترجاع (Saga Compensation & Refunds)
# ==============================================================================
# أ) متى يستطيع العميل الإلغاء؟
#    - فقط قبل قبول السائق للطلب (قبل حالة DRIVER_ACCEPTED).
#    - إذا تم الإلغاء، تقوم Saga فوراً باستدعاء CancelAuthorization لفك حجز المبلغ للعميل دون أي رسوم.

mutation CustomerCancelDelivery {
  cancelDelivery(
    deliveryId: "<DELIVERY_ID>"
    reason: "Customer changed mind before driver accepted"
  ) {
    success
    statusCode
    message
    data {
      id
      status          # CANCELLED
      cancelledAt
    }
  }
}

# ب) ماذا لو لم يجد النظام سائقاً خلال 10 دقائق (Timeout)؟
#    - يقوم السيرفر تلقائياً بإلغاء الطلب (CANCELLED).
#    - يتم تشغيل الـ Compensation: إلغاء حجز الأموال وإرسال إشعار لحظي للعميل (DELIVERY_CANCELLED).
