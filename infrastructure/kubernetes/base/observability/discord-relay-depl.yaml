apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-discord-depl
  namespace: default
  labels:
    app: alertmanager-discord
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager-discord
  template:
    metadata:
      labels:
        app: alertmanager-discord
    spec:
      containers:
        - name: alertmanager-discord
          image: delivery/alertmanager-discord
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: observability-secrets
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "200m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-discord-srv
  namespace: default
  labels:
    app: alertmanager-discord
spec:
  type: ClusterIP
  selector:
    app: alertmanager-discord
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
