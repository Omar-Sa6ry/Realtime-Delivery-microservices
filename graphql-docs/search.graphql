# Search users (Admin only; requires Bearer token with VIEW_USER permission)
query {
  searchUsers(
    input: {
      query: "john"
      pagination: { limit: 10 }
    }
  ) {
    success
    statusCode
    message
    items {
      id
      first_name
      last_name
      email
      role
      is_active
      created_at
    }
    pageInfo {
      hasNextPage
      cursor
      total
    }
  }
}

