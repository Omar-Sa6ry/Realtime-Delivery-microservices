# Search Health Probe (Public)
query SearchHealth {
  searchHealth {
    success
    statusCode
    message
    timeStamp
    data {
      status
      timestamp
    }
  }
}

# Autocomplete Suggestions (Public)
query Autocomplete {
  autocomplete(input: { prefix: "Screen", index: "media", limit: 5 }) {
    success
    statusCode
    message
    timeStamp
    data {
      suggestions
    }
  }
}

# Search Media (User / Driver / Admin)
query SearchMedia {
  searchMedia(input: { query: "Screen", pagination: { limit: 10 } }) {
    success
    statusCode
    message
    timeStamp
    data {
      paginationInfo {
        totalItems
        currentPage
        nextPage
      }
      items {
        media_id
        file_name
        mime_type
        owner_id
        size
        status
        created_at
      }
    }
  }
}

# Search Users (Admin)
query SearchUsers {
  searchUsers(
    input: {
      query: "omar"
      role: "user"
      isActive: true
      pagination: { limit: 4 }
    }
  ) {
    success
    statusCode
    message
    timeStamp
    data {
      paginationInfo {
        totalItems
        currentPage
        nextPage
      }
      items {
        id
        first_name
        last_name
        email
        email

        is_active
        created_at
      }
    }
  }
}

# Search Deliveries (Admin)
query SearchDeliveries {
  searchDeliveries(
    input: { query: "Cairo", status: "CREATED", pagination: { limit: 10 } }
  ) {
    success
    statusCode
    message
    timeStamp
    data {
      paginationInfo {
        totalItems
        currentPage
        nextPage
      }
      items {
        delivery_id
        customer_id
        driver_id
        status
        pickup {
          city
          country
          location {
            lat
            lon
          }
        }
        dropoff {
          city
          country
          location {
            lat
            lon
          }
        }
        created_at
        updated_at
        source_version
      }
    }
  }
}

# Search Nearby Deliveries using Geo Coordinates (Driver / Admin)
query NearbyDeliveries {
  nearbyDeliveries(
    input: { lat: 1.0, lon: 1.0, radiusKm: 1000.0, pagination: { limit: 10 } }
  ) {
    success
    statusCode
    message
    timeStamp
    data {
      paginationInfo {
        totalItems
        currentPage
        nextPage
      }
      items {
        delivery_id
        customer_id
        status
        pickup {
          city
          country
          location {
            lat
            lon
          }
        }
      }
    }
  }
}

# Search Drivers (Admin)
query SearchDrivers {
  searchDrivers(
    input: {
      query: "omar"
      geo: { lat: 1.0, lon: 10.0, radiusKm: 10.0 }
      vehicleType: "CAR"
      status: "AVAILABLE"
      minRating: 1
      pagination: { limit: 10 }
    }
  ) {
    success
    statusCode
    message
    timeStamp
    data {
      paginationInfo {
        totalItems
        currentPage
        nextPage
      }
      items {
        driver_id
        name
        status
        vehicle_type
        rating
        location {
          lat
          lon
        }
        updated_at
        source_version
      }
    }
  }
}

