apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: default
  labels:
    app: media-service
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: media-service
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9102"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: media-service-sa
      containers:
      - name: media-service
        image: delivery/media
        imagePullPolicy: IfNotPresent
        ports:
        - name: graphql
          containerPort: 4005
        - name: ws
          containerPort: 4003
        - name: grpc
          containerPort: 50052
        - name: metrics
          containerPort: 9102
        envFrom:
        - configMapRef:
            name: media-service-config
        - secretRef:
            name: media-service-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        startupProbe:
          httpGet:
            path: /healthz
            port: graphql
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: graphql
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 30
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: graphql
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 6
          timeoutSeconds: 5
        # FFmpeg and temporary media operations use the dedicated writable /tmp volume.
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 2Gi
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: media-service-pdb
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: media-service

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: media-service
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: media-service
  minReplicas: 1
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 25
        periodSeconds: 60
      selectPolicy: Max
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: media-service-egress
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: media-service
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 4005
    - protocol: TCP
      port: 4003
    - protocol: TCP
      port: 50052
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 9092
    - protocol: TCP
      port: 4566
    - protocol: TCP
      port: 3310
    - protocol: TCP
      port: 443

---
apiVersion: v1
kind: Service
metadata:
  name: media-srv
  namespace: default
  labels:
    app: media-service
spec:
  selector:
    app: media-service
  ports:
  - name: graphql
    port: 4005
    targetPort: 4005
    protocol: TCP
  - name: ws
    port: 4003
    targetPort: 4003
    protocol: TCP
  - name: grpc
    port: 50052
    targetPort: 50052
    protocol: TCP
  - name: metrics
    port: 9102
    targetPort: 9102
    protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: media-service-sa
  namespace: default