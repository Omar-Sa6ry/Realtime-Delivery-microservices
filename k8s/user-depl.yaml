apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user
  template:
    metadata:
      labels:
        app: user
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z user-db-srv 5432; do echo "Waiting for user-db..."; sleep 3; done; echo "user-db TCP ready"']
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis-srv 6379; do echo "Waiting for redis..."; sleep 3; done; echo "redis TCP ready"']
        - name: wait-for-nats
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z nats-srv 4222; do echo "Waiting for nats..."; sleep 3; done; echo "nats TCP ready"']
      containers:
        - name: user
          image: delivery/user 
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001 
            - containerPort: 50051
          startupProbe:
            httpGet:
              path: /user/health
              port: 4001
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /user/health
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /user/health
              port: 4001
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          env:
            - name: PORT_USER
              value: '4001'
              
            - name: DB_HOST
              value: 'user-db-srv'

            - name: DB_PORT
              value: '5432'

            - name: DB_NAME
              value: 'delivery_user_db'

            - name: NODE_ENV
              value: 'development'

            - name: JWT_EXPIRE
              value: '36000s'

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: JWT_SECRET

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: POSTGRES_PASSWORD
          
            - name: REDIS_HOST
              value: 'redis-srv'

            - name: REDIS_PORT
              value: '6379'

            - name: REDIS_DB
              value: '0'

            - name: NATS_URL
              value: 'nats://nats-srv:4222'
---
apiVersion: v1
kind: Service
metadata:
  name: user-srv
spec:
  selector:
    app: user
  ports:
    - name: http
      protocol: TCP
      port: 4001
      targetPort: 4001
    - name: grpc
      protocol: TCP
      port: 50051
      targetPort: 50051
