global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: development

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: media-service
    metrics_path: /metrics
    static_configs:
      - targets: ["media-service:9102"]

  - job_name: search-service
    metrics_path: /metrics
    static_configs:
      - targets: ["search-service:9103"]

  - job_name: payment-service
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-service:9106"]

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq-srv:15692"]

  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:4000"]

  - job_name: user-service
    metrics_path: /user/metrics
    static_configs:
      - targets: ["user-service:4001"]

  - job_name: delivery-service
    metrics_path: /metrics
    static_configs:
      - targets: ["delivery-service:4003"]

  - job_name: realtime-service
    metrics_path: /realtime/metrics
    static_configs:
      - targets: ["realtime-service:4006"]

  - job_name: notification-service
    metrics_path: /notification/metrics
    static_configs:
      - targets: ["notification-service:4004"]

  - job_name: driver-service
    metrics_path: /metrics
    static_configs:
      - targets: ["driver-service:9105"]

  - job_name: analytics-service
    metrics_path: /metrics
    static_configs:
      - targets: ["analytics-service:9107"]
