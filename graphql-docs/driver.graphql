# DRIVER SERVICE — GraphQL Operations Reference
# Port: 4008 | Subgraph: /driver/graphql
# ============================================================

# ─── QUERIES ───────────────────────────────────────────────

# Get Driver Service Health
query GetDriverServiceInfo {
  driverServiceInfo {
    success
    statusCode
    message
    timeStamp
    data { name  version  status }
  }
}

# Get Driver by ID - WRAPPED response (no nested driver{} wrapper)
# Fields appear under data { ... } { driver { ... } }
query GetDriver {
  driver(id: "driver-123") {
    success
    statusCode
    message
    timeStamp
    data {
      id
      userId
      status        # OFFLINE | AVAILABLE | BUSY
      vehicleType   # CAR | MOTORCYCLE | TRUCK
      plateNumber
      capacityKg
      capabilities
      serviceArea
      rating
      createdAt
      updatedAt
    }
  }
}

# Get My Driver Profile (authenticated driver) - WRAPPED response
query GetMyDriverProfile {
  myDriverProfile {
    success
    statusCode
    message
    timeStamp
    data {
      id
      userId
      status
      vehicleType
      plateNumber
      capacityKg
      capabilities
      serviceArea
      rating
      createdAt
      updatedAt
    }
  }
}

# Get Driver Active Assignment - WRAPPED response
query GetDriverActiveAssignment {
  driverActiveAssignment(driverId: "driver-123") {
    success
    statusCode
    message
    timeStamp
    data {
      id
      deliveryId
      driverId
      status        # OFFERED|ACCEPTED|ACTIVE|COMPLETED|REJECTED|EXPIRED|CANCELLED
      attemptNumber
      offeredAt
      expiresAt
      acceptedAt
      rejectedAt
      completedAt
      createdAt
      updatedAt
    }
  }
}

# Get Driver Status - WRAPPED response
query GetDriverStatus {
  driverStatus(driverId: "driver-123") {
    success
    statusCode
    message
    timeStamp
    data {
      driverId
      status
      hasActiveAssignment
      activeDeliveryId
      lastSeenAt
    }
  }
}

# Get Nearby Drivers - WRAPPED response (items under data { items })
query GetNearbyDrivers {
  nearbyDrivers(input: {
    latitude: 30.0444
    longitude: 31.2357
    radiusKm: 5.0
    vehicleType: CAR
    limit: 10
  }) {
    success
    statusCode
    message
    timeStamp
    data {
      paginationInfo {
        totalItems
        currentPage
        nextPage
      }
      items {
        driverId
        distanceMeters
        status
        vehicleType
        latitude
        longitude
      }
    }
  }
}

# Get Assignment by ID - WRAPPED response
query GetAssignment {
  assignment(id: "assignment-123") {
    success
    statusCode
    message
    timeStamp
    data {
      id
      deliveryId
      driverId
      status
      attemptNumber
      offeredAt
      expiresAt
      acceptedAt
      rejectedAt
      completedAt
      createdAt
      updatedAt
    }
  }
}

# ─── MUTATIONS ──────────────────────────────────────────────

# Go Online - WRAPPED response
mutation GoOnline {
  goOnline(idempotencyKey: "go-online-driver-123-1234567890") {
    success
    statusCode
    message
    timeStamp
    data {
      driverId
      status
      updatedAt
    }
  }
}

# Go Offline - WRAPPED response
