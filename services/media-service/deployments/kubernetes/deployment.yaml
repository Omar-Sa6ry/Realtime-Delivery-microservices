apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: default
  labels:
    app: media-service
    version: "1.0.0"
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: media-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # zero-downtime deployments
  template:
    metadata:
      labels:
        app: media-service
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9102"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: media-service-sa
      # Prevent co-location of replicas on the same node for fault tolerance
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - media-service
              topologyKey: kubernetes.io/hostname
      containers:
      - name: media-service
        image: media-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: grpc
          containerPort: 4002
        - name: metrics
          containerPort: 9102
        envFrom:
        - configMapRef:
            name: media-service-config
        - secretRef:
            name: media-service-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        # Liveness probe — restarts the pod if the gRPC health check fails
        livenessProbe:
          grpc:
            port: 4002
            service: media.v1.MediaService
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        # Readiness probe — removes the pod from service until ready
        readinessProbe:
          grpc:
            port: 4002
            service: media.v1.MediaService
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        # Startup probe — allows longer init time (DynamoDB table creation)
        startupProbe:
          grpc:
            port: 4002
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 12 # 60 seconds total
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop: ["ALL"]
      terminationGracePeriodSeconds: 60
