apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: driver-db-srv
  namespace: default
spec:
  serviceName: driver-db-srv
  replicas: 1
  selector:
    matchLabels:
      app: driver-db
  template:
    metadata:
      labels:
        app: driver-db
    spec:
      initContainers:
        - name: clean-incomplete-data
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ -f /data/db/mongod.lock ]; then
                echo "Removing stale mongod.lock file";
                rm -f /data/db/mongod.lock;
              fi
              if [ -f /data/db/WiredTiger.wt ] && [ -d /data/db/journal ]; then
                echo "Resetting corrupted MongoDB data files for clean startup";
                rm -rf /data/db/*;
              fi
              exit 0
          volumeMounts:
            - name: data
              mountPath: /data/db
      containers:
      - name: mongodb
        image: mongo:7
        args: ["--bind_ip", "0.0.0.0", "--wiredTigerCacheSizeGB", "0.25"]
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: data
          mountPath: /data/db
        startupProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        livenessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: driver-db-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: driver-db-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: standard
---
apiVersion: v1
kind: Service
metadata:
  name: driver-db-srv
  namespace: default
  labels:
    app: driver-db
spec:
  selector:
    app: driver-db
  ports:
  - name: mongodb
    protocol: TCP
    port: 27017
    targetPort: 27017