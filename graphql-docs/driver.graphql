  # Get Nearby Drivers - WRAPPED response
query GetNearbyDrivers {
  nearbyDrivers(input: {
      latitude: 30.0131
      longitude: 51.2089
    radiusKm: 50.0
    vehicleType: MOTORCYCLE
    limit: 10
  }) {
    success
    statusCode
    message
    timeStamp
    data {
      paginationInfo {
        totalItems
        currentPage
        nextPage
      }
      items {
        driver {
          id
          isActive
          rating
          isBlocked
              status
    vehicleType
    plateNumber
    createdAt
      capacityKg
      capabilities
      serviceArea
        }
        distanceMeters
        status
        vehicleType
        latitude
        longitude
        rating
        isBlocked
      }
    }
  }
}

