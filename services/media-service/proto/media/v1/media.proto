syntax = "proto3";

package media.v1;

option go_package = "github.com/Omar-Sa6ry/Realtime-Delivery-microservices/services/media-service/proto/media/v1;mediav1";

// MediaService is the internal gRPC API for the media service.
// It is called exclusively by the GraphQL Gateway — never directly by clients.
// File bytes NEVER pass through this API. Only metadata and signed URLs are exchanged.
service MediaService {
  // Upload lifecycle
  rpc CreateUploadSession(CreateUploadSessionRequest) returns (CreateUploadSessionResponse);
  rpc GetUploadStatus(GetUploadStatusRequest)         returns (GetUploadStatusResponse);
  rpc CompleteUpload(CompleteUploadRequest)           returns (CompleteUploadResponse);
  rpc AbortUpload(AbortUploadRequest)                 returns (AbortUploadResponse);

  // Media queries
  rpc GetMedia(GetMediaRequest)     returns (GetMediaResponse);
  rpc ListMedia(ListMediaRequest)   returns (ListMediaResponse);

  // Download
  rpc GetDownloadUrl(GetDownloadUrlRequest) returns (GetDownloadUrlResponse);

  // Deletion
  rpc DeleteMedia(DeleteMediaRequest) returns (DeleteMediaResponse);

  // Quota
  rpc GetQuota(GetQuotaRequest) returns (GetQuotaResponse);
}

// ─── Upload ────────────────────────────────────────────────────────────────────

message CreateUploadSessionRequest {
  string user_id         = 1; // injected by gRPC interceptor from x-user-id header
  string file_name       = 2;
  string content_type    = 3;
  int64  size            = 4;
  string checksum        = 5; // optional client SHA-256 hex
  string delivery_id     = 6; // optional
  string idempotency_key = 7;
}

message CreateUploadSessionResponse {
  string              media_id       = 1;
  string              upload_id      = 2;
  string              s3_upload_id   = 3;
  repeated PresignedPart presigned_parts = 4;
  int64               part_size      = 5;
  int32               total_parts    = 6;
  int64               expires_at     = 7; // unix seconds
}

message PresignedPart {
  int32  part_number   = 1;
  string presigned_url = 2;
}

message CompleteUploadRequest {
  string         user_id         = 1;
  string         upload_id       = 2;
  repeated UploadPart parts      = 3;
  string         idempotency_key = 4;
}

message UploadPart {
  int32  part_number = 1;
  string e_tag       = 2;
}

message CompleteUploadResponse {
  string media_id = 1;
  string status   = 2;
}

message AbortUploadRequest {
  string user_id   = 1;
  string upload_id = 2;
}

message AbortUploadResponse {
  bool success = 1;
}

message GetUploadStatusRequest {
  string user_id   = 1;
  string upload_id = 2;
}

message GetUploadStatusResponse {
  string         upload_id        = 1;
  string         status           = 2;
  int32          total_parts      = 3;
  int32          completed_parts  = 4;
  repeated int32 missing_parts    = 5;
  int64          expires_at       = 6; // unix seconds
}

// ─── Media ─────────────────────────────────────────────────────────────────────

message GetMediaRequest {
  string user_id  = 1;
  string media_id = 2;
}

message GetMediaResponse {
  MediaInfo media = 1;
}

message MediaInfo {
  string              media_id     = 1;
  string              owner_id     = 2;
  string              file_name    = 3;
  string              content_type = 4;
  string              media_type   = 5;
  int64               size         = 6;
  string              status       = 7;
  string              object_key   = 8;
  int64               created_at   = 9;  // unix seconds
  int64               updated_at   = 10;
  repeated MediaVersionInfo versions = 11;
}

message MediaVersionInfo {
  string version_type = 1;
  string object_key   = 2;
  string content_type = 3;
  int64  size         = 4;
  int32  width        = 5;
  int32  height       = 6;
  int64  duration_ms  = 7;
}

message ListMediaRequest {
  string owner_id      = 1;
  int32  limit         = 2;
  string cursor        = 3;
  string status_filter = 4;
}

message ListMediaResponse {
  repeated MediaInfo items       = 1;
  string             next_cursor = 2;
}

// ─── Download ──────────────────────────────────────────────────────────────────

message GetDownloadUrlRequest {
  string user_id        = 1;
  string media_id       = 2;
  string version_type   = 3; // "original", "thumbnail", "720p", etc.
  int32  expiry_seconds = 4;
}

message GetDownloadUrlResponse {
  string url          = 1; // NEVER log this field
  int64  expires_at   = 2;
  string content_type = 3;
}

// ─── Delete ────────────────────────────────────────────────────────────────────

message DeleteMediaRequest {
  string user_id         = 1;
  string media_id        = 2;
  string idempotency_key = 3;
}

message DeleteMediaResponse {
  bool accepted = 1; // always true — deletion is async
}

// ─── Quota ─────────────────────────────────────────────────────────────────────

message GetQuotaRequest {
  string user_id = 1;
}

message GetQuotaResponse {
  int64 used_bytes            = 1;
  int64 quota_bytes           = 2;
  int64 remaining_bytes       = 3;
  int32 active_uploads        = 4;
  int32 max_concurrent_uploads = 5;
}
